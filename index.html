<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivacyChat</title>
    <script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #313338;
            color: #dbdee1;
            overflow: hidden;
            position: relative;
        }

        /* --- AUTHENTICATION OVERLAY --- */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1e1f22;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background-color: #313338;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .auth-card h2 {
            color: #f2f3f5;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        .auth-field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .auth-field label {
            font-size: 12px;
            font-weight: 700;
            color: #b5bac1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .auth-field input {
            padding: 10px;
            background-color: #1e1f22;
            border: none;
            border-radius: 4px;
            color: #f2f3f5;
            font-size: 14px;
            outline: none;
        }

        .auth-btn-primary {
            background-color: #5865f2;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s ease;
        }

        .auth-btn-primary:hover {
            background-color: #4752c4;
        }

        .auth-btn-secondary {
            background: none;
            color: #00a8fc;
            border: none;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
        }

        .auth-btn-secondary:hover {
            text-decoration: underline;
        }

        .auth-error {
            color: #fa777c;
            font-size: 13px;
            display: none;
        }

        /* --- DISCORD LAYOUT STRUCTURE --- */
        
        /* 1. Leftmost Server Rail */
        #server-rail {
            width: 72px;
            background-color: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 8px;
            flex-shrink: 0;
            z-index: 101;
            overflow-y: auto;
        }

        .rail-item {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #313338;
            color: #dbdee1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: border-radius 0.2s ease, background-color 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .rail-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .rail-item:hover, .rail-item.active {
            border-radius: 16px;
            background-color: #5865f2;
            color: #fff;
        }

        .rail-separator {
            width: 32px;
            height: 2px;
            background-color: #35363c;
            border-radius: 1px;
            margin: 4px 0;
        }

        /* 2. Channels Sidebar */
        #sidebar {
            width: 240px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            border-top-left-radius: 8px;
            flex-shrink: 0;
            z-index: 100;
            transition: transform 0.2s ease;
        }

        .server-header {
            height: 48px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1f2023;
            font-weight: 600;
            color: #f2f3f5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .sidebar-scrollable {
            flex: 1;
            overflow-y: auto;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            font-size: 12px;
            font-weight: 700;
            color: #949ba4;
            text-transform: uppercase;
            letter-spacing: 0.2px;
        }

        .category-add-btn {
            background: none;
            border: none;
            color: #949ba4;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }

        .category-add-btn:hover {
            color: #f2f3f5;
        }

        .channel-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            padding: 6px 8px;
            margin: 1px 0;
            background: none;
            border: none;
            color: #949ba4;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
        }

        .channel-btn:hover {
            background-color: #35373c;
            color: #dbdee1;
        }

        .channel-btn.active {
            background-color: #404249;
            color: #fff;
        }

        .channel-btn .hashtag {
            font-size: 18px;
            color: #80848e;
        }

        .inline-add-channel {
            display: flex;
            gap: 4px;
            padding: 4px 8px;
        }

        .inline-add-channel input {
            flex: 1;
            background: #1e1f22;
            border: none;
            padding: 4px 8px;
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }

        .inline-add-channel button {
            background: #5865f2;
            border: none;
            color: white;
            padding: 0 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 3. Bottom Profile Dock */
        .user-profile-dock {
            height: 52px;
            background-color: #232428;
            padding: 0 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .dock-user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 0;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
        }

        .dock-user-info:hover {
            background-color: #35373c;
        }

        .dock-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .dock-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .dock-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .dock-username {
            font-size: 14px;
            font-weight: 600;
            color: #f2f3f5;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .dock-subtext {
            font-size: 11px;
            color: #949ba4;
        }

        /* 4. Chat View Area */
        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
            min-width: 0;
        }

        #chat-header {
            height: 48px;
            padding: 0 16px;
            background-color: #313338;
            border-bottom: 1px solid #1f2023;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .header-hashtag {
            font-size: 24px;
            color: #80848e;
            font-weight: 300;
        }

        .header-title {
            font-weight: 600;
            color: #f2f3f5;
            font-size: 16px;
        }

        #slowmode-warning {
            font-size: 12px;
            color: #fa777c;
            margin-left: auto;
            font-weight: 600;
            display: none;
        }

        #message-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Message Component */
        .message {
            display: flex;
            gap: 16px;
            padding: 2px 0;
            user-select: text;
        }

        .message:hover {
            background-color: #2e3035;
            margin: 0 -16px;
            padding: 2px 16px;
        }

        .msg-pfp {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .msg-pfp img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .msg-body {
            display: flex;
            flex-direction: column;
            max-width: 100%;
        }

        .msg-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .message .username {
            font-weight: 500;
            font-size: 15px;
            color: #f2f3f5;
            cursor: pointer;
        }

        .message .username:hover {
            text-decoration: underline;
        }

        .message .timestamp {
            font-size: 12px;
            color: #949ba4;
        }

        .message .text {
            color: #dbdee1;
            font-size: 15px;
            line-height: 1.375rem;
            word-break: break-word;
            margin-top: 2px;
        }

        /* Input Bar */
        #input-form {
            padding: 0 16px 24px 16px;
            background-color: #313338;
        }

        .input-wrapper-row {
            display: flex;
            align-items: center;
            background-color: #383a40;
            border-radius: 8px;
            padding: 0 12px;
        }

        #message-input {
            flex: 1;
            padding: 11px 0;
            border: none;
            background: transparent;
            color: #dbdee1;
            font-size: 15px;
            outline: none;
        }

        #message-input:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .media-attach-btn {
            background-color: #4e5058;
            color: #dbdee1;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
        }

        .media-attach-btn:hover {
            background-color: #6d6f78;
            color: #fff;
        }

        /* Modal Box */
        #create-server-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.7);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal-box {
            background-color: #313338;
            padding: 24px;
            border-radius: 8px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-box h3 {
            color: #f2f3f5;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-cancel {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            #sidebar {
                position: absolute;
                left: 72px;
                top: 0;
                height: 100%;
                transform: translateX(-320px);
            }
            #sidebar.active {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>

    <!-- Auth Overlay -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 id="auth-title">Welcome Back!</h2>
            <div class="auth-error" id="auth-error-msg">Error details</div>
            
            <div class="auth-field">
                <label for="auth-email">Email</label>
                <input type="email" id="auth-email" placeholder="user@domain.com">
            </div>
            
            <div class="auth-field">
                <label for="auth-password">Password</label>
                <input type="password" id="auth-password">
            </div>

            <button class="auth-btn-primary" id="submit-auth-btn" onclick="window.handleAuthAction()">Log In</button>
            <button class="auth-btn-secondary" id="toggle-auth-mode" onclick="window.switchAuthMode()">Need an account? Register</button>
        </div>
    </div>

    <!-- Create Server Modal -->
    <div id="create-server-modal">
        <div class="modal-box">
            <h3>Customize Your Server</h3>
            <div class="auth-field">
                <label>Server Name</label>
                <input type="text" id="custom-server-input" placeholder="My Awesome Server">
            </div>
            <div class="auth-field">
                <label>Server Icon (Image File or Image URL)</label>
                <input type="file" id="custom-server-icon-file" accept="image/*" style="display:none;" onchange="window.handleServerIconUpload(this)">
                <button type="button" class="auth-btn-primary" style="background:#4e5058; padding:8px;" onclick="document.getElementById('custom-server-icon-file').click()">Choose Local Image</button>
                <input type="text" id="custom-server-icon-url" placeholder="or paste image URL directly..." style="margin-top:4px;">
            </div>
            <div class="auth-field">
                <label>Privacy Node</label>
                <select id="server-visibility-select" style="padding:10px; background:#1e1f22; color:#fff; border:none; border-radius:4px;">
                    <option value="public">🌐 Public</option>
                    <option value="private">🔒 Private</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="document.getElementById('create-server-modal').style.display='none'">Cancel</button>
                <button class="auth-btn-primary" onclick="window.joinCustomServer()">Create</button>
            </div>
        </div>
    </div>

    <!-- 1. Left Rail (Server Icons Image Grid) -->
    <div id="server-rail">
        <!-- Default built-in image servers -->
        <div class="rail-item active" id="rail-server-1" title="Server 1" onclick="window.selectServer('server-1', 'Server 1')">
            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=Server1" alt="Server 1">
        </div>
        <div class="rail-item" id="rail-server-2" title="Server 2" onclick="window.selectServer('server-2', 'Server 2')">
            <img src="https://api.dicebear.com/7.x/identicon/svg?seed=Server2" alt="Server 2">
        </div>
        <div class="rail-separator"></div>
        <div id="custom-servers-rail" style="display:flex; flex-direction:column; gap:8px;"></div>
        <div class="rail-item" style="color: #23a55a;" title="Add a Server" onclick="document.getElementById('create-server-modal').style.display='flex'">+</div>
    </div>

    <!-- 2. Channels Sidebar -->
    <div id="sidebar">
        <div class="server-header" id="current-server-title">Server 1</div>
        
        <div class="sidebar-scrollable">
            <div class="category-header">
                <span>Text Channels</span>
                <button class="category-add-btn" onclick="window.toggleInlineAddChannel()">+</button>
            </div>

            <div class="inline-add-channel" id="inline-add-channel-box" style="display: none;">
                <input type="text" id="new-channel-input" placeholder="new-channel">
                <button onclick="window.submitNewChannel()">+</button>
            </div>

            <div id="channel-list"></div>
        </div>

        <!-- 3. Bottom User Profile Dock -->
        <div class="user-profile-dock">
            <div class="dock-user-info">
                <div class="dock-avatar" id="dock-avatar-box">👤</div>
                <div class="dock-text">
                    <div class="dock-username" id="dock-username-display">User</div>
                    <div class="dock-subtext">Online</div>
                </div>
            </div>
            <button onclick="window.logOutUser()" style="background:none; border:none; color:#da373c; cursor:pointer; font-size:12px; font-weight:bold;">Log Out</button>
        </div>
    </div>

    <!-- 4. Main Chat View -->
    <div id="chat-area">
        <div id="chat-header">
            <span class="header-hashtag">#</span>
            <div class="header-title" id="current-channel-name">general</div>
            <div id="slowmode-warning">Slowmode Active (5s Cooldown)</div>
        </div>

        <div id="message-container"></div>

        <form id="input-form" onsubmit="window.handleMessageSubmit(event)">
            <div class="input-wrapper-row">
                <label class="media-attach-btn">
                    +
                    <input type="file" id="media-attachment-input" accept="image/*,video/*" style="display:none;" onchange="window.handleFileSelect(this)">
                </label>
                <input type="text" id="message-input" placeholder="Message #general" autocomplete="off">
            </div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onChildAdded, onValue, off } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            databaseURL: "https://mock-privacychat-default-rtdb.firebaseio.com"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let activeServerId = 'server-1';
        let currentChannelId = 'server-1-general';
        let friendCode = '';
        let authMode = 'login';
        let uploadedServerIconBase64 = null;

        // Listener cleanup tracking
        let currentMessagesRef = null;
        let currentMessagesCallback = null;

        // Slowmode state
        let lastMessageSentTimestamp = 0;
        const SLOWMODE_DURATION_MS = 5000;

        window.selectServer = function(serverId, serverName) {
            activeServerId = serverId;
            document.getElementById('current-server-title').innerText = serverName;

            document.querySelectorAll('.rail-item').forEach(el => el.classList.remove('active'));
            const railEl = document.getElementById(`rail-${serverId}`);
            if (railEl) railEl.classList.add('active');

            loadServerChannels(serverId);
        };

        function loadServerChannels(serverId) {
            const list = document.getElementById('channel-list');
            list.innerHTML = '';

            onChildAdded(ref(db, `server_channels/${serverId}`), (snapshot) => {
                if (snapshot.exists()) {
                    renderChannelButton(serverId, snapshot.key, snapshot.val().name);
                }
            });
        }

        function renderChannelButton(serverId, channelId, channelName) {
            const list = document.getElementById('channel-list');
            const btn = document.createElement('button');
            btn.className = 'channel-btn';
            btn.id = `btn-chan-${channelId}`;
            btn.innerHTML = `<span class="hashtag">#</span> ${channelName}`;
            
            btn.onclick = () => {
                document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                window.switchChannel(channelId, channelName);
            };

            list.appendChild(btn);
        }

        window.switchChannel = function(channelId, channelName) {
            currentChannelId = channelId;
            document.getElementById('current-channel-name').innerText = channelName;
            document.getElementById('message-input').placeholder = `Message #${channelName}`;

            const container = document.getElementById('message-container');
            container.innerHTML = '';

            if (currentMessagesRef && currentMessagesCallback) {
                off(currentMessagesRef, 'child_added', currentMessagesCallback);
            }

            currentMessagesRef = ref(db, `messages/${currentChannelId}`);
            currentMessagesCallback = (snapshot) => {
                if (snapshot.exists()) {
                    renderMessageOnUI(snapshot.val());
                }
            };

            onChildAdded(currentMessagesRef, currentMessagesCallback);
        };

        function renderMessageOnUI(msg) {
            const container = document.getElementById('message-container');
            const node = document.createElement('div');
            node.className = 'message';
            const timeStr = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            node.innerHTML = `
                <div class="msg-pfp">${msg.pfp || '👤'}</div>
                <div class="msg-body">
                    <div class="msg-header">
                        <span class="username">${msg.username || 'User'}</span>
                        <span class="timestamp">${timeStr}</span>
                    </div>
                    <div class="text">${msg.text}</div>
                </div>
            `;

            container.appendChild(node);
            container.scrollTop = container.scrollHeight;
        }

        window.handleMessageSubmit = function(e) {
            e.preventDefault();
            const now = Date.now();

            if (now - lastMessageSentTimestamp < SLOWMODE_DURATION_MS) {
                const warningNode = document.getElementById('slowmode-warning');
                warningNode.style.display = 'block';
                setTimeout(() => { warningNode.style.display = 'none'; }, 2500);
                return;
            }

            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text) return;

            lastMessageSentTimestamp = now;
            input.disabled = true;
            setTimeout(() => { input.disabled = false; input.focus(); }, SLOWMODE_DURATION_MS);

            onValue(ref(db, `profiles/${friendCode}`), (snapshot) => {
                const profile = snapshot.val() || {};
                push(ref(db, `messages/${currentChannelId}`), {
                    username: profile.username || 'User',
                    pfp: profile.pfp || '👤',
                    text: text,
                    timestamp: Date.now()
                });
                input.value = '';
            }, { onlyOnce: true });
        };

        window.toggleInlineAddChannel = function() {
            const box = document.getElementById('inline-add-channel-box');
            box.style.display = box.style.display === 'none' ? 'flex' : 'none';
        };

        window.submitNewChannel = function() {
            const input = document.getElementById('new-channel-input');
            const name = input.value.trim().toLowerCase().replace(/\s+/g, '-');
            if (!name) return;

            const channelId = `chan-${push(ref(db, `server_channels/${activeServerId}`)).key}`;
            set(ref(db, `server_channels/${activeServerId}/${channelId}`), { name: name }).then(() => {
                input.value = '';
                document.getElementById('inline-add-channel-box').style.display = 'none';
            });
        };

        window.handleServerIconUpload = function(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedServerIconBase64 = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        window.joinCustomServer = function() {
            const name = document.getElementById('custom-server-input').value.trim();
            const visibility = document.getElementById('server-visibility-select').value;
            const inputUrl = document.getElementById('custom-server-icon-url').value.trim();
            
            if (!name) return;

            // Fallback icon generation if no picture provided
            let iconSrc = uploadedServerIconBase64 || inputUrl;
            if (!iconSrc) {
                iconSrc = `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(name)}`;
            }

            const serverId = 'custom-' + push(ref(db, 'custom_servers')).key;
            set(ref(db, `custom_servers/${serverId}`), { 
                name, 
                visibility, 
                icon: iconSrc, 
                creator: friendCode 
            }).then(() => {
                const chanId = `chan-${push(ref(db, `server_channels/${serverId}`)).key}`;
                set(ref(db, `server_channels/${serverId}/${chanId}`), { name: 'general' });
                
                uploadedServerIconBase64 = null;
                document.getElementById('custom-server-icon-url').value = '';
                document.getElementById('create-server-modal').style.display = 'none';
                document.getElementById('custom-server-input').value = '';
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                friendCode = user.uid;
                document.getElementById('auth-overlay').style.display = 'none';
                
                onValue(ref(db, `profiles/${friendCode}`), (snapshot) => {
                    const data = snapshot.val() || {};
                    document.getElementById('dock-username-display').innerText = data.username || friendCode.substring(0, 6);
                });

                // Render dynamic server picture icons on the rail
                onChildAdded(ref(db, 'custom_servers'), (snapshot) => {
                    if (snapshot.exists()) {
                        const sVal = snapshot.val();
                        const rail = document.getElementById('custom-servers-rail');
                        const icon = document.createElement('div');
                        icon.className = 'rail-item';
                        icon.id = `rail-${snapshot.key}`;
                        icon.title = sVal.name;
                        
                        // Render server picture image instead of name label
                        const iconUrl = sVal.icon || `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(sVal.name)}`;
                        icon.innerHTML = `<img src="${iconUrl}" alt="${sVal.name}">`;
                        
                        icon.onclick = () => window.selectServer(snapshot.key, sVal.name);
                        rail.appendChild(icon);
                    }
                });

                window.selectServer('server-1', 'Server 1');
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
            }
        });

        window.handleAuthAction = function() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            
            if (authMode === 'login') {
                signInWithEmailAndPassword(auth, email, password);
            } else {
                createUserWithEmailAndPassword(auth, email, password);
            }
        };

        window.logOutUser = function() {
            signOut(auth).then(() => location.reload());
        };
    </script>
</body>
</html>
