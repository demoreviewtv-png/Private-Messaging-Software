<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivacyChat</title>
    <script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #313338;
            color: #dbdee1;
        }

        #sidebar {
            width: 260px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border-right: 1px solid #1e1f22;
            overflow-y: auto;
        }

        .channel-title {
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            margin-bottom: 10px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .section-title {
            font-size: 12px;
            font-weight: bold;
            color: #949ba4;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .add-channel-btn {
            background: none;
            border: none;
            color: #949ba4;
            font-size: 16px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .add-channel-btn:hover {
            color: #fff;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin: 2px 0;
            background: none;
            border: none;
            color: #949ba4;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #35373c;
            color: #fff;
        }

        .sub-channel {
            padding-left: 24px;
            font-size: 13px;
        }

        .privacy-badge {
            font-size: 12px;
            background-color: #23a55a;
            color: white;
            padding: 5px 8px;
            border-radius: 4px;
            text-align: center;
            margin-top: 10px;
        }

        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        #chat-header {
            padding: 15px 20px;
            background-color: #313338;
            border-bottom: 1px solid #1e1f22;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-title {
            font-weight: bold;
            color: #fff;
            font-size: 16px;
        }

        .history-notice {
            font-size: 12px;
            color: #23a55a;
            font-weight: normal;
        }

        #message-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
        }

        .message .username {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
            cursor: pointer;
            width: fit-content;
        }

        .message .username:hover {
            text-decoration: underline;
        }

        .message .text {
            color: #dbdee1;
            font-size: 15px;
            word-break: break-word;
        }

        #input-form {
            padding: 20px;
            background-color: #313338;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #message-input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background-color: #383a40;
            color: #dbdee1;
            font-size: 15px;
            outline: none;
        }

        #db-status {
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #949ba4;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        #name-color {
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .pm-input-box {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .pm-input-box input {
            flex: 1;
            background: #1e1f22;
            border: none;
            padding: 5px;
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
        }

        .pm-input-box button {
            background: #5865f2;
            border: none;
            color: white;
            padding: 0 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .profile-container {
            background-color: #1e1f22;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            margin-top: 20px;
        }

        .username-edit-box {
            display: flex;
            gap: 5px;
            margin-top: 3px;
            margin-bottom: 8px;
        }

        .username-edit-box input {
            flex: 1;
            background: #2b2d31;
            border: 1px solid #383a40;
            padding: 4px 6px;
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }

        .username-edit-box button {
            background: #35373c;
            border: none;
            color: #dbdee1;
            padding: 0 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        
        .username-edit-box button:hover {
            background: #4e5058;
            color: #fff;
        }

        .reset-btn {
            background: none;
            border: none;
            color: #da373c;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            margin-top: 4px;
            display: block;
        }

        .reset-btn:hover {
            color: #ff7377;
        }

        .pm-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 2px 0;
        }

        .pm-item .nav-btn {
            margin: 0;
            flex: 1;
        }

        .nick-btn {
            background: none;
            border: none;
            color: #949ba4;
            font-size: 11px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }

        .nick-btn:hover {
            color: #fff;
            background-color: #35373c;
        }

        .server-container {
            margin-bottom: 10px;
        }

        .channels-wrapper {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <div class="channel-title">PrivacyChat</div>
            
            <div class="section-header">
                <span class="section-title">Servers</span>
            </div>
            <div id="server-list">
                <div class="server-container" id="container-server-1">
                    <button class="nav-btn active" id="btn-server-1" onclick="window.switchChannel('server-1', 'Server 1 🌐', this)">🌐 Server 1</button>
                </div>
                <div class="server-container" id="container-server-2">
                    <button class="nav-btn" id="btn-server-2" onclick="window.switchChannel('server-2', 'Server 2 🚀', this)">🚀 Server 2</button>
                </div>
            </div>
            
            <div class="pm-input-box">
                <input type="text" id="custom-server-input" placeholder="Create/Join Server...">
                <button onclick="window.joinCustomServer()">Join</button>
            </div>

            <div class="section-header">
                <span class="section-title">Private Messages</span>
            </div>
            <div id="pm-list"></div>
            <div class="pm-input-box">
                <input type="text" id="friend-code-input" placeholder="Friend Code...">
                <button onclick="window.connectToFriend()">Go</button>
            </div>
        </div>

        <div>
            <div class="profile-container">
                <div style="font-size: 11px; color: #949ba4; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Friend Code</div>
                <div id="friend-code-display" style="font-weight: bold; font-size: 15px; color: #fff; font-family: monospace;">Loading...</div>
                
                <div style="font-size: 11px; color: #949ba4; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; margin-top: 8px;">Username</div>
                <div class="username-edit-box">
                    <input type="text" id="username-input" maxlength="20" autocomplete="off">
                    <button id="save-username-btn" onclick="window.saveUsername()">Save</button>
                </div>

                <button class="nav-btn" id="notify-perm-btn" style="background-color: #35373c; color: #fff; text-align: center; margin-top: 8px; margin-bottom: 8px;" onclick="window.requestNotificationPermission()">
                    🔔 Enable Notifications
                </button>
                
                <button class="reset-btn" id="reset-id-btn" onclick="window.resetIdentity()">Reset Friend Code</button>
            </div>
            
            <div class="color-picker-wrapper">
                <label for="name-color" style="font-size: 12px; color: #949ba4;">Name Color:</label>
                <input type="color" id="name-color" value="#5865f2">
            </div>

            <div class="privacy-badge">Zero IP Tracking Active</div>
        </div>
    </div>

    <div id="chat-area">
        <div id="chat-header">
            <div class="header-title" id="room-title">Server 1 🌐</div>
            <div class="history-notice">⚡ Clean Slates: Resetting your identity will purge any servers you own from existence.</div>
        </div>
        <div id="message-container"></div>

        <form id="input-form">
            <input type="text" id="message-input" placeholder="Message" autocomplete="off" maxlength="500">
            <div id="db-status">🔵 Connecting to Realtime Database...</div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getDatabase, ref, push, set, get, child, onValue, remove, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxCqeBWxOkVbUWSu76qRzknJYPSceniZg",
            authDomain: "privatems-vercel-app.firebaseapp.com",
            databaseURL: "https://privatems-vercel-app-default-rtdb.firebaseio.com",
            projectId: "privatems-vercel-app",
            storageBucket: "privatems-vercel-app.firebasestorage.app",
            messagingSenderId: "259223551478",
            appId: "1:259223551478:web:960461ed4246235cc31bd7",
            measurementId: "G-ZSFBLCP1ML"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let username;
        let friendCode;
        let savedColor;
        let syncInterval = null;
        let profileInterval = null;
        let customServers = [];
        let savedDms = [];
        let nicknames = {};

        let activeFriendProfiles = {}; 
        let serverListeners = {}; 

        const usernameInput = document.getElementById('username-input');
        const colorPicker = document.getElementById('name-color');
        const roomTitle = document.getElementById('room-title');
        const container = document.getElementById('message-container');
        const form = document.getElementById('input-form');
        const input = document.getElementById('message-input');
        const statusLabel = document.getElementById('db-status');

        // Banned words listing array
        const BANNED_WORDS = ["badword1", "badword2", "spamtext"];

        function updateStatus(text, colorClass = "#949ba4") {
            statusLabel.innerHTML = text;
            statusLabel.style.color = colorClass;
        }

        // TEXT CENSOR ENGINE
        function censorText(inputText, channelName) {
            // If the channel name matches a Private Message structure (contains a user split code separation dash), skip censoring
            const isPrivateMessage = channelName.includes("-") && channelName.split("-").length === 2 && channelName.split("-")[0].length === 6;
            if (isPrivateMessage) {
                return inputText;
            }

            // Apply filter changes if inside public or custom text channel servers
            let filteredText = inputText;
            BANNED_WORDS.forEach(word => {
                const regex = new RegExp(`\\b${word}\\b`, "gi");
                filteredText = filteredText.replace(regex, "****");
            });
            return filteredText;
        }

        function generateRandomCode(length = 6) {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function checkCodeUniqueness(code) {
            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `profiles/${code}`));
                return !snapshot.exists();
            } catch (e) { return true; }
        }

        async function syncProfileToDatabase() {
            if (!friendCode) return;
            try {
                await set(ref(db, `profiles/${friendCode}`), {
                    username: username,
                    color: savedColor,
                    lastSeen: serverTimestamp()
                });
            } catch (e) { console.error("Profile sync error: ", e); }
        }

        // --- WEB NOTIFICATION SYSTEM ---
        window.requestNotificationPermission = function() {
            if (!("Notification" in window)) {
                alert("This browser does not support desktop notifications.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    new Notification("PrivacyChat", { body: "Notifications successfully enabled!" });
                    document.getElementById('notify-perm-btn').textContent = "🔕 Notifications On";
                }
            });
        };

        function sendDeviceNotification(senderName, messageText) {
            if (Notification.permission === "granted" && document.hidden) {
                new Notification(`New message from ${senderName}`, {
                    body: censorText(messageText, currentChannelName)
                });
            }
        }

        if ("Notification" in window && Notification.permission === "granted") {
            setTimeout(() => {
                const btn = document.getElementById('notify-perm-btn');
                if (btn) btn.textContent = "🔕 Notifications On";
            }, 100);
        }

        async function initIdentity() {
            updateStatus("🔵 Assigning credentials...", "#5865f2");
            friendCode = localStorage.getItem('privacy_chat_friend_code');
            
            if (!friendCode) {
                let isUnique = false;
                let loops = 0;
                while (!isUnique && loops < 10) {
                    friendCode = generateRandomCode(6);
                    isUnique = await checkCodeUniqueness(friendCode);
                    loops++;
                }
                localStorage.setItem('privacy_chat_friend_code', friendCode);
            }

            username = localStorage.getItem('privacy_chat_username');
            if (!username) {
                username = `User-${friendCode}`;
                localStorage.setItem('privacy_chat_username', username);
            }
            
            savedColor = localStorage.getItem('privacy_chat_color') || '#5865f2';

            document.getElementById('friend-code-display').textContent = `#${friendCode}`;
            usernameInput.value = username;
            usernameInput.style.color = savedColor;
            colorPicker.value = savedColor;
            
            try {
                customServers = JSON.parse(localStorage.getItem('privacy_chat_custom_servers')) || [];
            } catch (e) { customServers = []; }
            renderCustomServers();

            try {
                savedDms = JSON.parse(localStorage.getItem('privacy_chat_saved_dms')) || [];
                nicknames = JSON.parse(localStorage.getItem('privacy_chat_nicknames')) || {};
            } catch (e) {
                savedDms = [];
                nicknames = {};
            }
            rebuildDmList();

            await verifyAndRegisterUsername(username, true);

            await syncProfileToDatabase();
            updateStatus("🟢 Realtime DB Syncing Active", "#23a55a");
            startAutoSync(currentChannelName);
            startProfileChecking();
        }

        async function verifyAndRegisterUsername(targetUsername, isInitialSetup = false) {
            const cleanUserKey = targetUsername.toLowerCase().trim().replace(/[^a-z0-9]/g, '-');
            if (!cleanUserKey) return false;

            const userLockRef = ref(db, `username_locks/${cleanUserKey}`);
            
            try {
                const snapshot = await get(userLockRef);
                
                if (snapshot.exists()) {
                    const lockData = snapshot.val();
                    
                    if (lockData.ownerCode === friendCode) {
                        return true;
                    }
                    
                    const enteredPassword = prompt(`The username "${targetUsername}" is protected. Enter password to sync this profile:`);
                    if (enteredPassword === lockData.password) {
                        friendCode = lockData.ownerCode;
                        localStorage.setItem('privacy_chat_friend_code', friendCode);
                        document.getElementById('friend-code-display').textContent = `#${friendCode}`;
                        
                        try {
                            const profileDataSnap = await get(ref(db, `profiles/${friendCode}`));
                            if (profileDataSnap.exists()) {
                                savedColor = profileDataSnap.val().color || savedColor;
                                colorPicker.value = savedColor;
                                usernameInput.style.color = savedColor;
                            }
                        } catch(err) {}

                        alert(`Identity successfully restored! Connected as profile #${friendCode}`);
                        return true;
                    } else {
                        alert("Incorrect password! Identity recovery rejected.");
                        if (isInitialSetup) {
                            username = `User-${friendCode}`;
                            localStorage.setItem('privacy_chat_username', username);
                            usernameInput.value = username;
                        }
                        return false;
                    }
                } else {
                    const newPassword = prompt(`Create a protective password for the username "${targetUsername}" so other devices can claim this identity loop:`);
                    const safePassword = newPassword ? newPassword.trim() : "1234";
                    
                    await set(userLockRef, {
                        ownerCode: friendCode,
                        password: safePassword
                    });
                    return true;
                }
            } catch (err) {
                console.error("Lock validation error: ", err);
                return false;
            }
        }

        window.saveUsername = async function() {
            const newName = usernameInput.value.trim();
            if (newName === "") {
                alert("Username cannot be blank!");
                usernameInput.value = username;
                return;
            }

            updateStatus("🔵 Verifying username availability...", "#5865f2");
            const authorized = await verifyAndRegisterUsername(newName, false);
            
            if (!authorized) {
                usernameInput.value = username;
                updateStatus("🟢 Realtime DB Syncing Active", "#23a55a");
                return;
            }

            if (newName === username && confirm("Would you like to change your protective password for this username?")) {
                const cleanUserKey = newName.toLowerCase().trim().replace(/[^a-z0-9]/g, '-');
                const updatePass = prompt("Enter your new protection password:");
                if (updatePass) {
                    await set(ref(db, `username_locks/${cleanUserKey}`), {
                        ownerCode: friendCode,
                        password: updatePass.trim()
                    });
                    alert("Password updated successfully!");
                }
            }

            username = newName;
            localStorage.setItem('privacy_chat_username', username);
            await syncProfileToDatabase();
            
            usernameInput.blur();
            const saveBtn = document.getElementById('save-username-btn');
            const oldText = saveBtn.textContent;
            saveBtn.textContent = "Saved!";
            setTimeout(() => saveBtn.textContent = oldText, 1500);
            updateStatus("🟢 Realtime DB Syncing Active", "#23a55a");
        };

        window.resetIdentity = async function() {
            if (confirm("Are you sure you want to change your Friend Code? All servers you created will be DELETED forever from the database.")) {
                updateStatus("🔴 Purging owned servers...", "#da373c");
                
                for (let srv of customServers) {
                    try {
                        const metaRef = ref(db, `server_metadata/${srv.id}`);
                        const snap = await get(metaRef);
                        if (snap.exists() && snap.val().owner === friendCode) {
                            await remove(metaRef);
                            await remove(ref(db, `messages/${srv.id}`));
                            
                            if (snap.val().channels) {
                                for (let chId of Object.keys(snap.val().channels)) {
                                    await remove(ref(db, `messages/${chId}`));
                                }
                            }
                        }
                    } catch (e) { console.error(e); }
                }

                Object.keys(serverListeners).forEach(id => {
                    if (serverListeners[id]) serverListeners[id]();
                });
                serverListeners = {};

                localStorage.removeItem('privacy_chat_friend_code');
                localStorage.removeItem('privacy_chat_username');
                localStorage.removeItem('privacy_chat_custom_servers');
                localStorage.removeItem('privacy_chat_saved_dms');
                localStorage.removeItem('privacy_chat_nicknames');
                
                document.getElementById('friend-code-display').textContent = 'Loading...';
                customServers = [];
                
                await initIdentity();
                window.switchChannel('server-1', 'Server 1 🌐');
            }
        };

        colorPicker.addEventListener('input', async function(e) {
            savedColor = e.target.value;
            usernameInput.style.color = savedColor;
            localStorage.setItem('privacy_chat_color', savedColor);
            await syncProfileToDatabase();
        });

        // --- APINATOR LIVE CONFIGURATION ---
        const pusher = new Pusher('app_0eb6e0fdc30452b7c1c55f2cc8ba6843052381e4', {
            cluster: 'us', 
            wsHost: 'rt.apinator.io',
            forceTLS: true,
            enabledTransports: ['ws', 'wss']
        });

        let currentChannelName = 'server-1';
        let currentSubscription = pusher.subscribe('server-1');
        bindChannelEvents(currentSubscription);
        initIdentity();

        function bindChannelEvents(channel) {
            channel.bind('client-message', function(data) {
                if (data.senderCode !== friendCode) {
                    activeFriendProfiles[data.senderCode] = {
                        username: data.senderName,
                        color: data.color
                    };
                    let displayName = nicknames[data.senderCode] || data.senderName;
                    
                    // Filter inbound socket transmission streams
                    let processedText = censorText(data.text, currentChannelName);
                    
                    appendMessage(displayName, processedText, data.color, data.senderCode);
                    sendDeviceNotification(displayName, processedText);
                }
            });
        }

        window.switchChannel = function(targetChannel, displayName, eventSource = null) {
            pusher.unsubscribe(currentChannelName);
            container.innerHTML = '';
            roomTitle.textContent = displayName;
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (eventSource) {
                eventSource.classList.add('active');
            } else if (document.getElementById(`btn-${targetChannel}`)) {
                document.getElementById(`btn-${targetChannel}`).classList.add('active');
            }

            currentChannelName = targetChannel;
            currentSubscription = pusher.subscribe(targetChannel);
            bindChannelEvents(currentSubscription);

            startAutoSync(targetChannel);
        };

        // --- REALTIME DB HISTORY & FETCH AUTO-SYNC ---
        let initialLoadDone = {}; 
        async function loadMessageHistory(channelName, isSilent = false) {
            if (!friendCode) return;
            if (!isSilent) {
                container.innerHTML = '<div style="color: #949ba4; font-size: 13px;">Loading history...</div>';
                updateStatus("🔵 Fetching realtime pipeline history...", "#5865f2");
            }
            
            try {
                const messageRef = ref(db, `messages/${channelName}`);
                const snapshot = await get(messageRef);
                const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 40;
                
                let existingMsgCount = container.querySelectorAll('.message').length;
                container.innerHTML = ''; 
                
                let index = 0;
                if (snapshot.exists()) {
                    snapshot.forEach((childSnapshot) => {
                        const data = childSnapshot.val();
                        let displayName = data.senderName;
                        let displayColor = data.color || '#949ba4';
                        
                        if (nicknames[data.senderCode]) {
                            displayName = nicknames[data.senderCode];
                        } else if (activeFriendProfiles[data.senderCode]) {
                            displayName = activeFriendProfiles[data.senderCode].username;
                            displayColor = activeFriendProfiles[data.senderCode].color;
                        }
                        
                        // Filter historical message records pulled from cloud storage
                        let processedText = censorText(data.text, channelName);
                        
                        silentAppend(displayName, processedText, displayColor, data.senderCode);
                        
                        if (isSilent && initialLoadDone[channelName] && index >= existingMsgCount && data.senderCode !== friendCode) {
                            sendDeviceNotification(displayName, processedText);
                        }
                        index++;
                    });
                    
                    initialLoadDone[channelName] = true;

                    if (wasAtBottom || !isSilent) {
                        container.scrollTop = container.scrollHeight;
                    }
                } else {
                    initialLoadDone[channelName] = true;
                    container.innerHTML = `<div style="color: #23a55a; font-size:13px;">No past history found in this room yet. Start typing!</div>`;
                }
                updateStatus("🟢 Realtime DB Syncing Active", "#23a55a");
            } catch (error) {
                console.error("Error loading chat history: ", error);
                if (!isSilent) {
                    container.innerHTML = '<div style="color: #da373c; font-size: 13px;">Error loading data history from Realtime Database.</div>';
                }
                updateStatus(`🔴 DB Error: ${error.message}`, "#da373c");
            }
        }

        function startAutoSync(channelName) {
            if (syncInterval) clearInterval(syncInterval);
            loadMessageHistory(channelName, false);
            syncInterval = setInterval(() => {
                loadMessageHistory(channelName, true);
            }, 2500);
        }

        function startProfileChecking() {
            if (profileInterval) clearInterval(profileInterval);
            profileInterval = setInterval(async () => {
                const checkedCodes = Object.keys(activeFriendProfiles);
                if (checkedCodes.length === 0) return;

                let profilesChanged = false;
                for (let code of checkedCodes) {
                    try {
                        const profileSnapshot = await get(ref(db, `profiles/${code}`));
                        if (profileSnapshot.exists()) {
                            const remoteProfile = profileSnapshot.val();
                            const cachedProfile = activeFriendProfiles[code];
                            
                            if (remoteProfile.username !== cachedProfile.username || remoteProfile.color !== cachedProfile.color) {
                                activeFriendProfiles[code] = {
                                    username: remoteProfile.username,
                                    color: remoteProfile.color
                                };
                                profilesChanged = true;
                            }
                        }
                    } catch (err) { console.error(err); }
                }
                if (profilesChanged) {
                    rebuildDmList();
                    loadMessageHistory(currentChannelName, true);
                }
            }, 5000);
        }

        // --- CUSTOM SERVERS HANDLING ---
        window.joinCustomServer = async function() {
            const rawInput = document.getElementById('custom-server-input').value.trim();
            if (!rawInput) return;
            
            const serverID = "custom-" + rawInput.toLowerCase().replace(/[^a-z0-9]/g, '-').substring(0, 15);
            const serverLabel = "🛠️ " + rawInput.substring(0, 20);

            if (customServers.some(s => s.id === serverID)) {
                alert("You are already in this server room!");
                return;
            }

            updateStatus("🔵 Registering server metadata...", "#5865f2");
            const serverMetadataRef = ref(db, `server_metadata/${serverID}`);
            const metaSnap = await get(serverMetadataRef);
            
            if (!metaSnap.exists()) {
                await set(serverMetadataRef, {
                    name: serverLabel,
                    owner: friendCode
                });
            }

            customServers.push({ id: serverID, name: serverLabel });
            localStorage.setItem('privacy_chat_custom_servers', JSON.stringify(customServers));
            renderCustomServers();
            document.getElementById('custom-server-input').value = '';
            
            const newlyCreatedBtn = document.getElementById(`btn-${serverID}`);
            if (newlyCreatedBtn) {
                window.switchChannel(serverID, serverLabel, newlyCreatedBtn);
            }
        };

        window.addChannelPrompt = async function(serverId, serverName) {
            const channelNameInput = prompt("Enter new text channel name:");
            if (!channelNameInput) return;

            const channelSlug = channelNameInput.toLowerCase().replace(/[^a-z0-9]/g, '-').substring(0, 15);
            if (!channelSlug) return;

            const channelID = `${serverId}-${channelSlug}`;
            const channelRef = ref(db, `server_metadata/${serverId}/channels/${channelID}`);
            await set(channelRef, {
                id: channelID,
                name: `# ${channelNameInput.substring(0, 20)}`
            });
        };

        function renderCustomServers() {
            document.querySelectorAll("[id^='container-custom-']").forEach(el => el.remove());
            const listContainer = document.getElementById('server-list');
            
            customServers.forEach(srv => {
                const srvContainer = document.createElement('div');
                srvContainer.className = 'server-container';
                srvContainer.id = `container-${srv.id}`;

                const mainBtn = document.createElement('button');
                mainBtn.id = `btn-${srv.id}`;
                mainBtn.className = 'nav-btn';
                mainBtn.textContent = srv.name;
                mainBtn.onclick = function() { window.switchChannel(srv.id, srv.name, mainBtn); };
                
                const channelsWrapper = document.createElement('div');
                channelsWrapper.className = 'channels-wrapper';
                channelsWrapper.id = `channels-${srv.id}`;

                srvContainer.appendChild(mainBtn);
                srvContainer.appendChild(channelsWrapper);
                listContainer.appendChild(srvContainer);

                if (serverListeners[srv.id]) serverListeners[srv.id](); 
                const metaRef = ref(db, `server_metadata/${srv.id}`);
                serverListeners[srv.id] = onValue(metaRef, (snapshot) => {
                    channelsWrapper.innerHTML = '';
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        
                        if (data.owner === friendCode && !document.getElementById(`add-btn-${srv.id}`)) {
                            let headerDiv = document.createElement('div');
                            headerDiv.className = 'section-header';
                            headerDiv.style.paddingLeft = '10px';
                            headerDiv.innerHTML = `<span class="section-title" style="font-size:10px;">Channels</span>
                                <button class="add-channel-btn" id="add-btn-${srv.id}" title="Add Channel">+</button>`;
                            channelsWrapper.appendChild(headerDiv);
                            
                            headerDiv.querySelector('.add-channel-btn').onclick = (e) => {
                                e.stopPropagation();
                                window.addChannelPrompt(srv.id, srv.name);
                            };
                        }

                        if (data.channels) {
                            Object.values(data.channels).forEach(ch => {
                                const chBtn = document.createElement('button');
                                chBtn.id = `btn-${ch.id}`;
                                chBtn.className = 'nav-btn sub-channel';
                                chBtn.textContent = ch.name;
                                chBtn.onclick = function() { 
                                    window.switchChannel(ch.id, `${srv.name} ➡️ ${ch.name}`, chBtn); 
                                };
                                channelsWrapper.appendChild(chBtn);
                                if (currentChannelName === ch.id) chBtn.classList.add('active');
                            });
                        }
                    }
                });
            });
        }

        // --- PRIVATE MESSAGE STUFF ---
        window.clickUserToFriend = async function(targetCode, targetDefaultName) {
            if (!targetCode || targetCode === friendCode) return;
            if (confirm(`Do you want to add ${targetDefaultName} (#${targetCode}) to your Private Messages?`)) {
                await window.executeFriendConnection(targetCode);
            }
        };

        window.executeFriendConnection = async function(targetCode) {
            if (!savedDms.includes(targetCode)) {
                savedDms.push(targetCode);
                localStorage.setItem('privacy_chat_saved_dms', JSON.stringify(savedDms));
            }

            let initialTargetName = `#${targetCode}`;
            try {
                const pSnap = await get(ref(db, `profiles/${targetCode}`));
                if (pSnap.exists()) {
                    const pData = pSnap.val();
                    activeFriendProfiles[targetCode] = { username: pData.username, color: pData.color };
                    initialTargetName = pData.username;
                } else {
                    activeFriendProfiles[targetCode] = { username: initialTargetName, color: '#949ba4' };
                }
            } catch(e) { activeFriendProfiles[targetCode] = { username: initialTargetName, color: '#949ba4' }; }

            rebuildDmList();
            const pmChannelID = [friendCode, targetCode].sort().join('-').replace(/[^a-zA-Z0-9-_]/g, '');
            const targetBtn = document.getElementById(`btn-${pmChannelID}`);
            const currentLabel = nicknames[targetCode] || initialTargetName;
            
            window.switchChannel(pmChannelID, `DM with ${currentLabel}`, targetBtn);
        };

        window.connectToFriend = async function() {
            let rawTargetInput = document.getElementById('friend-code-input').value;
            let targetCode = rawTargetInput.trim().toUpperCase().replace(/#/g, '');
            
            if (!targetCode || targetCode === friendCode) return;
            await window.executeFriendConnection(targetCode);
            document.getElementById('friend-code-input').value = '';
        };

        window.setCustomNickname = function(targetCode) {
            const existingNick = nicknames[targetCode] || "";
            const newNick = prompt(`Enter a private nickname for #${targetCode}:`, existingNick);
            if (newNick === null) return;
            
            if (newNick.trim() === "") {
                delete nicknames[targetCode];
            } else { nicknames[targetCode] = newNick.trim(); }
            
            localStorage.setItem('privacy_chat_nicknames', JSON.stringify(nicknames));
            rebuildDmList();
            
            const pmChannelID = [friendCode, targetCode].sort().join('-').replace(/[^a-zA-Z0-9-_]/g, '');
            if (currentChannelName === pmChannelID) {
                const displayTitle = nicknames[targetCode] || (activeFriendProfiles[targetCode] ? activeFriendProfiles[targetCode].username : `#${targetCode}`);
                roomTitle.textContent = `DM with ${displayTitle}`;
            }
            loadMessageHistory(currentChannelName, true);
        };

        function rebuildDmList() {
            const pmList = document.getElementById('pm-list');
            pmList.innerHTML = '';

            savedDms.forEach(targetCode => {
                const pmChannelID = [friendCode, targetCode].sort().join('-').replace(/[^a-zA-Z0-9-_]/g, '');
                let resolvedLabel = `#${targetCode}`;
                if (nicknames[targetCode]) {
                    resolvedLabel = nicknames[targetCode];
                } else if (activeFriendProfiles[targetCode]) {
                    resolvedLabel = activeFriendProfiles[targetCode].username;
                }

                const containerDiv = document.createElement('div');
                containerDiv.className = 'pm-item';

                const btn = document.createElement('button');
                btn.id = `btn-${pmChannelID}`;
                btn.className = 'nav-btn';
                btn.textContent = `💬 ${resolvedLabel}`;
                btn.onclick = function() { window.switchChannel(pmChannelID, `DM with ${resolvedLabel}`, btn); };

                const nickBtn = document.createElement('button');
                nickBtn.className = 'nick-btn';
                nickBtn.textContent = '✏️';
                nickBtn.title = "Set Private Nickname";
                nickBtn.onclick = function(e) {
                    e.stopPropagation();
                    window.setCustomNickname(targetCode);
                };

                containerDiv.appendChild(btn);
                containerDiv.appendChild(nickBtn);
                pmList.appendChild(containerDiv);
                if (currentChannelName === pmChannelID) btn.classList.add('active');
            });
        }

        // --- CHAT FORM & SEND CONFIGURATION ---
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const messageText = input.value.trim();
            if (messageText === '') return;

            // Apply censor rules conditionally before local element additions
            let localProcessedText = censorText(messageText, currentChannelName);

            appendMessage(username, localProcessedText, savedColor, friendCode);
            input.value = '';
            updateStatus("🟡 Uploading stream data...", "#f2a359");

            currentSubscription.trigger('client-message', {
                senderName: username,
                senderCode: friendCode,
                text: messageText, // Send raw value over socket; recipient censors locally
                color: savedColor
            });

            try {
                const roomMsgRef = ref(db, `messages/${currentChannelName}`);
                const newMsgRef = push(roomMsgRef);
                await set(newMsgRef, {
                    senderName: username,
                    senderCode: friendCode,
                    text: messageText, // Store raw value; clean history reads handle rendering
                    color: savedColor,
                    timestamp: serverTimestamp()
                });
                updateStatus("🟢 Message saved securely!", "#23a55a");
                setTimeout(() => updateStatus("🟢 Realtime DB Syncing Active", "#23a55a"), 1000);
            } catch (err) {
                console.error("Database write failure: ", err);
                updateStatus(`🔴 Failed to save: ${err.message}`, "#da373c");
            }
        });

        function silentAppend(user, text, color, senderIdCode) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            const usernameSpan = document.createElement('span');
            usernameSpan.classList.add('username');
            usernameSpan.textContent = user;
            usernameSpan.style.color = color;
            
            if (senderIdCode && senderIdCode !== friendCode) {
                usernameSpan.setAttribute('onclick', `window.clickUserToFriend('${senderIdCode}', '${user.replace(/'/g, "\\'")}')`);
            }

            const textSpan = document.createElement('span');
            textSpan.classList.add('text');
            textSpan.textContent = text;

            messageDiv.appendChild(usernameSpan);
            messageDiv.appendChild(textSpan);
            container.appendChild(messageDiv);
        }

        function appendMessage(user, text, color, senderIdCode) {
            silentAppend(user, text, color, senderIdCode);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
