<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivacyChat</title>
    <script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #313338;
            color: #dbdee1;
        }

        #sidebar {
            width: 260px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border-right: 1px solid #1e1f22;
        }

        .channel-title {
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            margin-bottom: 10px;
        }

        .section-title {
            font-size: 12px;
            font-weight: bold;
            color: #949ba4;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin: 4px 0;
            background: none;
            border: none;
            color: #949ba4;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #35373c;
            color: #fff;
        }

        .privacy-badge {
            font-size: 12px;
            background-color: #23a55a;
            color: white;
            padding: 5px 8px;
            border-radius: 4px;
            text-align: center;
        }

        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        #chat-header {
            padding: 15px 20px;
            background-color: #313338;
            border-bottom: 1px solid #1e1f22;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-title {
            font-weight: bold;
            color: #fff;
            font-size: 16px;
        }

        .history-notice {
            font-size: 12px;
            color: #f2a359;
            font-weight: normal;
        }

        #message-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
        }

        .message .username {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .message .text {
            color: #dbdee1;
            font-size: 15px;
            word-break: break-word;
        }

        #input-form {
            padding: 20px;
            background-color: #313338;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #message-input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background-color: #383a40;
            color: #dbdee1;
            font-size: 15px;
            outline: none;
        }

        #message-input:disabled {
            background-color: #2b2d31;
            color: #949ba4;
            cursor: not-allowed;
        }

        /* Status Indicator Styling */
        #db-status {
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #949ba4;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        #name-color {
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .pm-input-box {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .pm-input-box input {
            flex: 1;
            background: #1e1f22;
            border: none;
            padding: 5px;
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
        }

        .pm-input-box button {
            background: #5865f2;
            border: none;
            color: white;
            padding: 0 8px;
            border-radius: 4px;
            cursor: pointer;
        }

        .profile-container {
            background-color: #1e1f22;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .username-edit-box {
            display: flex;
            gap: 5px;
            margin-top: 3px;
            margin-bottom: 8px;
        }

        .username-edit-box input {
            flex: 1;
            background: #2b2d31;
            border: 1px solid #383a40;
            padding: 4px 6px;
            color: #fff;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            outline: none;
        }

        .username-edit-box button {
            background: #35373c;
            border: none;
            color: #dbdee1;
            padding: 0 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        
        .username-edit-box button:hover {
            background: #4e5058;
            color: #fff;
        }

        .reset-btn {
            background: none;
            border: none;
            color: #da373c;
            font-size: 11px;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            margin-top: 4px;
            display: block;
        }

        .reset-btn:hover {
            color: #ff7377;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <div class="channel-title">PrivacyChat</div>
            
            <div class="section-title">Servers</div>
            <button class="nav-btn active" id="btn-server-1" onclick="switchChannel('server-1', 'Server 1 🌐')">🌐 Server 1</button>
            <button class="nav-btn" id="btn-server-2" onclick="switchChannel('server-2', 'Server 2 🚀')">🚀 Server 2</button>

            <div class="section-title">Private Messages</div>
            <div id="pm-list"></div>
            <div class="pm-input-box">
                <input type="text" id="friend-code-input" placeholder="Friend Code...">
                <button onclick="connectToFriend()">Go</button>
            </div>
        </div>

        <div>
            <div class="profile-container">
                <div style="font-size: 11px; color: #949ba4; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Friend Code</div>
                <div id="friend-code-display" style="font-weight: bold; font-size: 15px; color: #fff; font-family: monospace;"></div>
                
                <div style="font-size: 11px; color: #949ba4; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; margin-top: 8px;">Username</div>
                <div class="username-edit-box">
                    <input type="text" id="username-input" maxlength="20" autocomplete="off">
                    <button id="save-username-btn">Save</button>
                </div>
                
                <button class="reset-btn" id="reset-id-btn">Reset Friend Code</button>
            </div>
            
            <div class="color-picker-wrapper">
                <label for="name-color" style="font-size: 12px; color: #949ba4;">Name Color:</label>
                <input type="color" id="name-color" value="#5865f2">
            </div>

            <div class="privacy-badge">Zero IP Tracking Active</div>
        </div>
    </div>

    <div id="chat-area">
        <div id="chat-header">
            <div class="header-title" id="room-title">Server 1 🌐</div>
            <div class="history-notice">⏳ History Enabled: Messages sent here are saved dynamically to Firebase.</div>
        </div>
        <div id="message-container">
            </div>

        <form id="input-form">
            <input type="text" id="message-input" placeholder="Message" autocomplete="off" maxlength="500">
            <div id="db-status">🔵 Connecting to database...</div>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAxCqeBWxOkVbUWSu76qRzknJYPSceniZg",
            authDomain: "privatems-vercel-app.firebaseapp.com",
            projectId: "privatems-vercel-app",
            storageBucket: "privatems-vercel-app.firebasestorage.app",
            messagingSenderId: "259223551478",
            appId: "1:259223551478:web:960461ed4246235cc31bd7",
            measurementId: "G-ZSFBLCP1ML"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let username;
        let friendCode;
        let savedColor;

        const usernameInput = document.getElementById('username-input');
        const colorPicker = document.getElementById('name-color');
        const roomTitle = document.getElementById('room-title');
        const container = document.getElementById('message-container');
        const form = document.getElementById('input-form');
        const input = document.getElementById('message-input');
        const statusLabel = document.getElementById('db-status');

        // Update the status bar UI helper
        function updateStatus(text, colorClass = "#949ba4") {
            statusLabel.innerHTML = text;
            statusLabel.style.color = colorClass;
        }

        function initIdentity() {
            friendCode = localStorage.getItem('privacy_chat_friend_code');
            if (!friendCode) {
                friendCode = Math.floor(100000 + Math.random() * 900000).toString();
                localStorage.setItem('privacy_chat_friend_code', friendCode);
            }

            username = localStorage.getItem('privacy_chat_username');
            if (!username) {
                username = `User-${friendCode}`;
                localStorage.setItem('privacy_chat_username', username);
            }
            
            savedColor = localStorage.getItem('privacy_chat_color') || '#5865f2';

            document.getElementById('friend-code-display').textContent = `#${friendCode}`;
            usernameInput.value = username;
            usernameInput.style.color = savedColor;
            colorPicker.value = savedColor;
            
            updateStatus("🟢 Database Ready & Syncing", "#23a55a");
        }

        window.saveUsername = function() {
            const newName = usernameInput.value.trim();
            if (newName === "") {
                alert("Username cannot be blank!");
                usernameInput.value = username;
                return;
            }
            username = newName;
            localStorage.setItem('privacy_chat_username', username);
            
            usernameInput.blur();
            const saveBtn = document.getElementById('save-username-btn');
            const oldText = saveBtn.textContent;
            saveBtn.textContent = "Saved!";
            setTimeout(() => saveBtn.textContent = oldText, 1500);
        }
        document.getElementById('save-username-btn').onclick = window.saveUsername;

        window.resetIdentity = function() {
            if (confirm("Are you sure you want to change your Friend Code? Old conversation loops will break.")) {
                localStorage.removeItem('privacy_chat_friend_code');
                localStorage.removeItem('privacy_chat_username');
                initIdentity();
                switchChannel('server-1', 'Server 1 🌐');
            }
        }
        document.getElementById('reset-id-btn').onclick = window.resetIdentity;

        initIdentity();

        colorPicker.addEventListener('input', function(e) {
            savedColor = e.target.value;
            usernameInput.style.color = savedColor;
            localStorage.setItem('privacy_chat_color', savedColor);
        });

        // --- APINATOR LIVE CONFIGURATION ---
        const pusher = new Pusher('app_0eb6e0fdc30452b7c1c55f2cc8ba6843052381e4', {
            cluster: 'us', 
            wsHost: 'rt.apinator.io',
            forceTLS: true,
            enabledTransports: ['ws', 'wss']
        });

        let currentChannelName = 'server-1';
        let currentSubscription = pusher.subscribe('server-1');
        bindChannelEvents(currentSubscription);
        loadMessageHistory('server-1');

        function bindChannelEvents(channel) {
            channel.bind('client-message', function(data) {
                if (data.senderCode !== friendCode) {
                    appendMessage(data.senderName, data.text, data.color);
                }
            });
        }

        window.switchChannel = function(targetChannel, displayName, eventSource = null) {
            pusher.unsubscribe(currentChannelName);
            container.innerHTML = '';
            roomTitle.textContent = displayName;
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (eventSource) {
                eventSource.classList.add('active');
            } else if (document.getElementById(`btn-${targetChannel}`)) {
                document.getElementById(`btn-${targetChannel}`).classList.add('active');
            }

            currentChannelName = targetChannel;
            currentSubscription = pusher.subscribe(targetChannel);
            bindChannelEvents(currentSubscription);

            loadMessageHistory(targetChannel);
        }

        // --- FIREBASE LIVE HISTORY RETRIEVAL ---
        async function loadMessageHistory(channelName) {
            container.innerHTML = '<div style="color: #949ba4; font-size: 13px;">Loading history...</div>';
            updateStatus("🔵 Fetching database history...", "#5865f2");
            try {
                const q = query(
                    collection(db, "messages"),
                    where("channel", "==", channelName),
                    orderBy("timestamp", "asc")
                );
                
                const querySnapshot = await getDocs(q);
                container.innerHTML = ''; 
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    appendMessage(data.senderName, data.text, data.color);
                });

                if(container.children.length === 0) {
                    container.innerHTML = `<div style="color: #23a55a; font-size:13px;">No past history found in this room yet. Start typing!</div>`;
                }
                updateStatus("🟢 Database Ready & Syncing", "#23a55a");
            } catch (error) {
                console.error("Error loading chat history: ", error);
                container.innerHTML = '<div style="color: #da373c; font-size: 13px;">Error loading data history from Firebase.</div>';
                updateStatus(`🔴 Firebase Error: ${error.message}. Check Security Rules/Indexes.`, "#da373c");
            }
        }

        window.connectToFriend = function() {
            let targetCode = document.getElementById('friend-code-input').value.trim().replace('#', '');
            if (!targetCode || targetCode === friendCode) return;

            const pmChannelID = [friendCode, targetCode].sort().join('-').replace(/[^a-zA-Z0-9-_]/g, '');
            const pmList = document.getElementById('pm-list');
            
            let btn = document.getElementById(`btn-${pmChannelID}`);
            if (!btn) {
                btn = document.createElement('button');
                btn.id = `btn-${pmChannelID}`;
                btn.className = 'nav-btn';
                btn.textContent = `💬 #${targetCode}`;
                btn.onclick = function() { window.switchChannel(pmChannelID, `DM with #${targetCode}`, btn); };
                pmList.appendChild(btn);
            }
            
            window.switchChannel(pmChannelID, `DM with #${targetCode}`, btn);
            document.getElementById('friend-code-input').value = '';
        }

        // --- CHAT FORM & 10s SLOWMODE LOGIC ---
        const COOLDOWN_MS = 10000;

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const messageText = input.value.trim();
            if (messageText === '' || input.disabled) return;

            // 1. Show message on screen instantly
            appendMessage(username, messageText, savedColor);
            input.value = '';
            activateSlowmode();

            // 2. Update status to saving
            updateStatus("🟡 Sending message to Firebase storage...", "#f2a359");

            // 3. Broadcast real-time over Apinator
            currentSubscription.trigger('client-message', {
                senderName: username,
                senderCode: friendCode,
                text: messageText,
                color: savedColor
            });

            // 4. Save to Firebase
            try {
                await addDoc(collection(db, "messages"), {
                    channel: currentChannelName,
                    senderName: username,
                    senderCode: friendCode,
                    text: messageText,
                    color: savedColor,
                    timestamp: serverTimestamp()
                });
                updateStatus("🟢 Message saved securely!", "#23a55a");
                setTimeout(() => updateStatus("🟢 Database Ready & Syncing", "#23a55a"), 2000);
            } catch (err) {
                console.error("Firebase write failure: ", err);
                updateStatus(`🔴 Failed to save: ${err.message}`, "#da373c");
            }
        });

        function activateSlowmode() {
            input.disabled = true;
            let timeLeft = COOLDOWN_MS / 1000;
            input.placeholder = `Slowmode active... Wait ${timeLeft.toFixed(1)}s`;

            const interval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    input.disabled = false;
                    input.placeholder = "Message";
                    input.focus();
                } else {
                    input.placeholder = `Slowmode active... Wait ${timeLeft.toFixed(1)}s`;
                }
            }, 100);
        }

        function appendMessage(user, text, color) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            const usernameSpan = document.createElement('span');
            usernameSpan.classList.add('username');
            usernameSpan.textContent = user;
            usernameSpan.style.color = color;

            const textSpan = document.createElement('span');
            textSpan.classList.add('text');
            textSpan.textContent = text;

            messageDiv.appendChild(usernameSpan);
            messageDiv.appendChild(textSpan);
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
