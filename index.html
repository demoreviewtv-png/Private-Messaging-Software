<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivacyChat</title>
    <script src="https://js.pusher.com/8.0.1/pusher.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #313338;
            color: #dbdee1;
        }

        #sidebar {
            width: 260px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            border-right: 1px solid #1e1f22;
        }

        .section-title {
            font-size: 12px;
            font-weight: bold;
            color: #949ba4;
            text-transform: uppercase;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        .nav-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin: 4px 0;
            background: none;
            border: none;
            color: #949ba4;
            text-align: left;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #35373c;
            color: #fff;
        }

        .privacy-badge {
            font-size: 12px;
            background-color: #23a55a;
            color: white;
            padding: 5px 8px;
            border-radius: 4px;
            text-align: center;
        }

        #chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        #chat-header {
            padding: 15px 20px;
            background-color: #313338;
            border-bottom: 1px solid #1e1f22;
            font-weight: bold;
            color: #fff;
        }

        #message-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            display: flex;
            flex-direction: column;
        }

        .message .username {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 2px;
        }

        .message .text {
            color: #dbdee1;
            font-size: 15px;
            word-break: break-word;
        }

        #input-form {
            padding: 20px;
            background-color: #313338;
        }

        #message-input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            background-color: #383a40;
            color: #dbdee1;
            font-size: 15px;
            outline: none;
        }

        #message-input:disabled {
            background-color: #2b2d31;
            color: #949ba4;
            cursor: not-allowed;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        #name-color {
            border: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .pm-input-box {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }

        .pm-input-box input {
            flex: 1;
            background: #1e1f22;
            border: none;
            padding: 5px;
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
        }

        .pm-input-box button {
            background: #5865f2;
            border: none;
            color: white;
            padding: 0 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div>
            <div class="channel-title" style="font-weight: bold; font-size: 18px; color: #fff; margin-bottom: 10px;">PrivacyChat</div>
            
            <div class="section-title">Servers</div>
            <button class="nav-btn active" onclick="switchChannel('server-1', 'Server 1 🌐')">🌐 Server 1</button>
            <button class="nav-btn" onclick="switchChannel('server-2', 'Server 2 🚀')">🚀 Server 2</button>

            <div class="section-title">Private Messages</div>
            <div id="pm-list"></div>
            <div class="pm-input-box">
                <input type="text" id="friend-code-input" placeholder="Friend Code...">
                <button onclick="connectToFriend()">Go</button>
            </div>
        </div>

        <div>
            <div style="font-size: 12px; color: #949ba4; margin-bottom: 4px;">Your Friend Code:</div>
            <div id="user-display" style="font-weight: bold; font-size: 13px; margin-bottom: 10px;"></div>
            
            <div class="color-picker-wrapper">
                <label for="name-color" style="font-size: 12px; color: #949ba4;">Name Color:</label>
                <input type="color" id="name-color" value="#5865f2">
            </div>

            <div class="privacy-badge">Zero-Data Mode Active</div>
        </div>
    </div>

    <div id="chat-area">
        <div id="chat-header">Server 1 🌐</div>
        <div id="message-container">
            <div class="message">
                <span class="username" style="color: #23a55a;">System</span>
                <span class="text">Welcome. 10s slowmode is active. Share your Friend Code to text privately!</span>
            </div>
        </div>

        <form id="input-form">
            <input type="text" id="message-input" placeholder="Message" autocomplete="off" maxlength="500">
        </form>
    </div>

    <script>
        // Generate and Save Unique Friend Code Identities
        let username = localStorage.getItem('privacy_chat_username');
        if (!username) {
            const randomId = Math.floor(100000 + Math.random() * 900000); // 6-digit code
            username = `User-${randomId}`;
            localStorage.setItem('privacy_chat_username', username);
        }
        
        let savedColor = localStorage.getItem('privacy_chat_color') || '#5865f2';

        const userDisplay = document.getElementById('user-display');
        const colorPicker = document.getElementById('name-color');
        const chatHeader = document.getElementById('chat-header');
        
        userDisplay.textContent = username;
        userDisplay.style.color = savedColor;
        colorPicker.value = savedColor;

        colorPicker.addEventListener('input', function(e) {
            savedColor = e.target.value;
            userDisplay.style.color = savedColor;
            localStorage.setItem('privacy_chat_color', savedColor);
        });

        // --- APINATOR / PUSHER SYSTEM ---
        const pusher = new Pusher('app_0eb6e0fdc30452b7c1c55f2cc8ba6843052381e4', {
            cluster: 'us', 
            wsHost: 'rt.apinator.io',
            forceTLS: true,
            enabledTransports: ['ws', 'wss']
        });

        let currentChannelName = 'server-1';
        let currentSubscription = pusher.subscribe('server-1');
        bindChannelEvents(currentSubscription);

        function bindChannelEvents(channel) {
            channel.bind('client-message', function(data) {
                if (data.sender !== username) {
                    appendMessage(data.sender, data.text, data.color);
                }
            });
        }

        function switchChannel(targetChannel, displayName) {
            // Unsubscribe from previous room
            pusher.unsubscribe(currentChannelName);
            
            // Clear message UI screen
            document.getElementById('message-container').innerHTML = '';
            chatHeader.textContent = displayName;
            
            // Update Navigation UI buttons highlights
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event?.target?.classList?.add('active');

            // Subscribe to the new channel
            currentChannelName = targetChannel;
            currentSubscription = pusher.subscribe(targetChannel);
            bindChannelEvents(currentSubscription);
        }

        function connectToFriend() {
            const targetCode = document.getElementById('friend-code-input').value.trim();
            if (!targetCode || targetCode === username) return;

            // Generate a combined unique room string specific only to these 2 users sorted alphabetically
            const pmChannelID = [username, targetCode].sort().join('-').replace(/[^a-zA-Z0-9-_]/g, '');
            
            // Add to sidebar list
            const pmList = document.getElementById('pm-list');
            if (!document.getElementById(`btn-${pmChannelID}`)) {
                const btn = document.createElement('button');
                btn.id = `btn-${pmChannelID}`;
                btn.className = 'nav-btn';
                btn.textContent = `💬 ${targetCode}`;
                btn.onclick = () => switchChannel(pmChannelID, `DM with ${targetCode}`);
                pmList.appendChild(btn);
            }
            
            switchChannel(pmChannelID, `DM with ${targetCode}`);
            document.getElementById('friend-code-input').value = '';
        }

        // --- CHAT FORM & 10s SLOWMODE LOGIC ---
        const form = document.getElementById('input-form');
        const input = document.getElementById('message-input');
        const container = document.getElementById('message-container');
        const COOLDOWN_MS = 10000; // 10 seconds

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const messageText = input.value.trim();
            if (messageText === '' || input.disabled) return;

            appendMessage(username, messageText, savedColor);

            currentSubscription.trigger('client-message', {
                sender: username,
                text: messageText,
                color: savedColor
            });

            input.value = '';
            activateSlowmode();
        });

        function activateSlowmode() {
            input.disabled = true;
            let timeLeft = COOLDOWN_MS / 1000;
            input.placeholder = `Slowmode active... Wait ${timeLeft.toFixed(1)}s`;

            const interval = setInterval(() => {
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    input.disabled = false;
                    input.placeholder = "Message";
                    input.focus();
                } else {
                    input.placeholder = `Slowmode active... Wait ${timeLeft.toFixed(1)}s`;
                }
            }, 100);
        }

        function appendMessage(user, text, color) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');

            const usernameSpan = document.createElement('span');
            usernameSpan.classList.add('username');
            usernameSpan.textContent = user;
            usernameSpan.style.color = color;

            const textSpan = document.createElement('span');
            textSpan.classList.add('text');
            textSpan.textContent = text;

            messageDiv.appendChild(usernameSpan);
            messageDiv.appendChild(textSpan);
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
