<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Chat Requiem - WebTV Edition</title>
  
  <!-- Firebase SDKs (Compat versions) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    /* WebTV Aesthetic Core Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #0d1b2a;
      color: #e0e1dd;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    /* Outer WebTV Screen Shell */
    .tv-container {
      width: 100%;
      max-width: 820px;
      background: #1b263b;
      border: 4px solid #415a77;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 90vh;
      max-height: 720px;
    }

    /* WebTV Banner Header */
    .webtv-header {
      background: linear-gradient(180deg, #1b3b6f 0%, #061a40 100%);
      color: #fca311;
      padding: 12px 20px;
      border-bottom: 3px solid #fca311;
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-shadow: 1px 1px 2px #000;
    }

    .webtv-header h1 {
      font-size: 1.3rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .status-badge {
      font-size: 0.85rem;
      color: #e0e1dd;
      background-color: #000814;
      padding: 4px 10px;
      border: 1px solid #415a77;
      border-radius: 4px;
    }

    /* Content Area */
    .tv-body {
      flex: 1;
      padding: 15px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #0d1b2a;
    }

    /* Auth Panel */
    .auth-box {
      max-width: 360px;
      margin: auto;
      background: #1b263b;
      border: 2px solid #fca311;
      padding: 20px;
      border-radius: 8px;
      width: 100%;
      text-align: center;
    }

    .auth-box h2 {
      color: #fca311;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }

    .form-group {
      margin-bottom: 12px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #e0e1dd;
    }

    input[type="text"], input[type="email"], input[type="password"], input[type="color"] {
      width: 100%;
      padding: 8px 10px;
      background: #000814;
      border: 1px solid #415a77;
      color: #ffffff;
      font-size: 0.95rem;
      border-radius: 4px;
      outline: none;
    }

    input[type="color"] {
      height: 38px;
      padding: 2px;
      cursor: pointer;
    }

    input:focus {
      border-color: #fca311;
    }

    /* Buttons */
    .btn {
      background: linear-gradient(180deg, #fca311 0%, #c77d00 100%);
      color: #000;
      font-weight: bold;
      border: 1px solid #fff;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.9rem;
      margin-top: 5px;
    }

    .btn:hover {
      background: #fca311;
    }

    .btn-secondary {
      background: #415a77;
      color: #fff;
      border: 1px solid #778da9;
    }

    .btn-secondary:hover {
      background: #778da9;
    }

    .auth-toggle {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #778da9;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Chat Layout */
    .app-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 10px;
    }

    .sub-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1b263b;
      padding: 8px 12px;
      border: 1px solid #415a77;
      border-radius: 4px;
    }

    .user-info {
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fca311;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      border: 1px solid #fff;
      flex-shrink: 0;
    }

    .user-details {
      display: flex;
      flex-direction: column;
    }

    .user-bio {
      font-size: 0.75rem;
      color: #778da9;
      font-style: italic;
    }

    /* Chat Messages Box */
    .messages-box {
      flex: 1;
      background: #000814;
      border: 2px solid #415a77;
      border-radius: 4px;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-item {
      padding: 8px 12px;
      border-radius: 6px;
      max-width: 80%;
      align-self: flex-start;
      border: 1px solid #415a77;
      display: flex;
      gap: 10px;
    }

    .message-item.own {
      align-self: flex-end;
    }

    .msg-content-wrap {
      display: flex;
      flex-direction: column;
    }

    .msg-header {
      font-size: 0.8rem;
      margin-bottom: 3px;
      display: flex;
      gap: 10px;
      font-weight: bold;
      opacity: 0.9;
    }

    .msg-time {
      font-weight: normal;
      font-size: 0.75rem;
      opacity: 0.7;
    }

    .msg-text {
      font-size: 0.95rem;
      word-break: break-word;
    }

    /* Message Input Bar */
    .input-bar {
      display: flex;
      gap: 8px;
    }

    .input-bar input {
      flex: 1;
    }

    /* Profile Panel */
    .profile-panel {
      background: #1b263b;
      border: 2px solid #fca311;
      padding: 20px;
      border-radius: 6px;
      max-width: 500px;
      margin: auto;
      width: 100%;
      overflow-y: auto;
      max-height: 100%;
    }

    .profile-panel h2 {
      color: #fca311;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Helper Utilities */
    .hidden {
      display: none !important;
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 0.8rem;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="tv-container">
    <!-- WebTV Header Bar -->
    <div class="webtv-header">
      <h1>Privacy Chat Requiem</h1>
      <div id="statusBadge" class="status-badge">Offline</div>
    </div>

    <!-- Main Screen Body -->
    <div class="tv-body">
      
      <!-- AUTH SCREEN -->
      <div id="authScreen" class="auth-box">
        <h2 id="authTitle">User Login</h2>
        
        <div class="form-group hidden" id="displayNameGroup">
          <label>Display Name</label>
          <input type="text" id="regDisplayName" placeholder="e.g. AnonUser">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="authEmail" placeholder="user@domain.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="authPassword" placeholder="••••••••">
        </div>

        <button id="authBtn" class="btn" onclick="handleAuth()">Connect</button>
        <div id="authError" class="error-msg"></div>

        <div class="auth-toggle" onclick="toggleAuthMode()">
          <span id="authToggleText">Need an account? Register here</span>
        </div>
      </div>

      <!-- MAIN CHAT SCREEN -->
      <div id="chatScreen" class="app-layout hidden">
        <div class="sub-nav">
          <div class="user-info">
            <div id="userAvatar" class="avatar-icon">?</div>
            <div class="user-details">
              <span id="userDisplay" style="font-weight: bold;">Loading...</span>
              <span id="userBio" class="user-bio">No status set</span>
            </div>
          </div>
          <div>
            <button class="btn btn-secondary" onclick="showProfileView(true)">Profile</button>
            <button class="btn btn-secondary" onclick="logout()">Disconnect</button>
          </div>
        </div>

        <div id="messagesBox" class="messages-box">
          <!-- Messages inserted dynamically -->
        </div>

        <form class="input-bar" onsubmit="sendMessage(event)">
          <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
          <button type="submit" class="btn">Send</button>
        </form>
      </div>

      <!-- EDIT PROFILE SCREEN -->
      <div id="profileScreen" class="profile-panel hidden">
        <h2>Custom Profile Studio</h2>
        
        <div class="grid-2">
          <div class="form-group">
            <label>Display Name</label>
            <input type="text" id="editDisplayName">
          </div>
          <div class="form-group">
            <label>Avatar Symbol (1 Char)</label>
            <input type="text" id="editAvatar" maxlength="1">
          </div>
        </div>

        <div class="form-group">
          <label>Status Bio</label>
          <input type="text" id="editBio" placeholder="e.g. Stealth Mode Active">
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Avatar Background Color</label>
            <input type="color" id="editAvatarBg" value="#fca311">
          </div>
          <div class="form-group">
            <label>Avatar Text Color</label>
            <input type="color" id="editAvatarColor" value="#000000">
          </div>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Chat Bubble Color</label>
            <input type="color" id="editBubbleBg" value="#1b263b">
          </div>
          <div class="form-group">
            <label>Chat Text Color</label>
            <input type="color" id="editTextColor" value="#ffffff">
          </div>
        </div>

        <div id="profileError" class="error-msg"></div>

        <div style="margin-top: 15px; display: flex; gap: 8px;">
          <button class="btn" onclick="saveProfile()">Save Profile</button>
          <button class="btn btn-secondary" onclick="showProfileView(false)">Cancel</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Firebase Configuration Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyClRzYRn4d4iXLLKQGRVntev3LQwTfuDLQ",
      authDomain: "redroom-9f4a0.firebaseapp.com",
      databaseURL: "https://redroom-9f4a0-default-rtdb.firebaseio.com",
      projectId: "redroom-9f4a0",
      storageBucket: "redroom-9f4a0.firebasestorage.app",
      messagingSenderId: "646291907356",
      appId: "1:646291907356:web:29f88d37dbed10775790d9",
      measurementId: "G-5QF7S4HR60"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // App State Variables
    let isRegisterMode = false;
    let currentUser = null;
    let isListeningMessages = false;
    let userProfile = {
      displayName: 'Anonymous',
      avatar: '?',
      bio: '',
      avatarBg: '#fca311',
      avatarColor: '#000000',
      bubbleBg: '#1b263b',
      textColor: '#ffffff'
    };

    // DOM Elements
    const statusBadge = document.getElementById('statusBadge');
    const authScreen = document.getElementById('authScreen');
    const chatScreen = document.getElementById('chatScreen');
    const profileScreen = document.getElementById('profileScreen');
    const authTitle = document.getElementById('authTitle');
    const authBtn = document.getElementById('authBtn');
    const authToggleText = document.getElementById('authToggleText');
    const displayNameGroup = document.getElementById('displayNameGroup');
    const authError = document.getElementById('authError');
    const messagesBox = document.getElementById('messagesBox');

    // Authentication State Change
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUser = user;
        statusBadge.textContent = "Online";
        statusBadge.style.borderColor = "#fca311";
        
        loadUserProfile(user.uid);
        
        if (!isListeningMessages) {
          listenForMessages();
          isListeningMessages = true;
        }

        authScreen.classList.add('hidden');
        profileScreen.classList.add('hidden');
        chatScreen.classList.remove('hidden');
      } else {
        currentUser = null;
        isListeningMessages = false;
        statusBadge.textContent = "Offline";
        statusBadge.style.borderColor = "#415a77";
        
        db.ref('messages').off(); // Detach Firebase listeners
        messagesBox.innerHTML = '';
        
        chatScreen.classList.add('hidden');
        profileScreen.classList.add('hidden');
        authScreen.classList.remove('hidden');
      }
    });

    // Toggle Registration/Login UI
    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      authError.textContent = '';
      if (isRegisterMode) {
        authTitle.textContent = "New Account";
        authBtn.textContent = "Register";
        authToggleText.textContent = "Already registered? Login here";
        displayNameGroup.classList.remove('hidden');
      } else {
        authTitle.textContent = "User Login";
        authBtn.textContent = "Connect";
        authToggleText.textContent = "Need an account? Register here";
        displayNameGroup.classList.add('hidden');
      }
    }

    // Handle Auth Login / Register
    function handleAuth() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const displayName = document.getElementById('regDisplayName').value.trim();

      authError.textContent = '';

      if (!email || !password) {
        authError.textContent = "Please fill out email and password.";
        return;
      }

      if (isRegisterMode) {
        if (!displayName) {
          authError.textContent = "Please enter a display name.";
          return;
        }
        auth.createUserWithEmailAndPassword(email, password)
          .then((cred) => {
            const initialAvatar = displayName.charAt(0).toUpperCase() || 'U';
            return db.ref('users/' + cred.user.uid).set({
              displayName: displayName,
              avatar: initialAvatar,
              bio: 'Active User',
              avatarBg: '#fca311',
              avatarColor: '#000000',
              bubbleBg: '#1b263b',
              textColor: '#ffffff'
            });
          })
          .catch((err) => { authError.textContent = err.message; });
      } else {
        auth.signInWithEmailAndPassword(email, password)
          .catch((err) => { authError.textContent = err.message; });
      }
    }

    // Disconnect/Logout
    function logout() {
      auth.signOut();
    }

    // Read User Profile Data
    function loadUserProfile(uid) {
      db.ref('users/' + uid).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          userProfile = { ...userProfile, ...val };
          
          document.getElementById('userDisplay').textContent = userProfile.displayName;
          document.getElementById('userBio').textContent = userProfile.bio || 'No status set';
          
          const avatarEl = document.getElementById('userAvatar');
          avatarEl.textContent = userProfile.avatar || '?';
          avatarEl.style.backgroundColor = userProfile.avatarBg || '#fca311';
          avatarEl.style.color = userProfile.avatarColor || '#000000';
        }
      });
    }

    // Realtime Single Listener for Messages (Fixes 3x rendering bug)
    function listenForMessages() {
      messagesBox.innerHTML = ''; // Ensure container is clean
      db.ref('messages').limitToLast(50).on('child_added', (snapshot) => {
        const msg = snapshot.val();
        renderMessage(msg, snapshot.key);
      });
    }

    // Render Chat Message Box
    function renderMessage(msg, key) {
      if (document.getElementById(`msg-${key}`)) return; // Duplicate safety check

      const isOwn = currentUser && msg.uid === currentUser.uid;
      
      const msgDiv = document.createElement('div');
      msgDiv.id = `msg-${key}`;
      msgDiv.className = `message-item ${isOwn ? 'own' : ''}`;
      
      // Apply Custom User Styling
      msgDiv.style.backgroundColor = msg.bubbleBg || (isOwn ? '#2b3a4e' : '#1b263b');
      msgDiv.style.color = msg.textColor || '#ffffff';

      // Avatar Icon
      const avatarDiv = document.createElement('div');
      avatarDiv.className = 'avatar-icon';
      avatarDiv.textContent = msg.avatar || '?';
      avatarDiv.style.backgroundColor = msg.avatarBg || '#fca311';
      avatarDiv.style.color = msg.avatarColor || '#000000';

      const contentWrap = document.createElement('div');
      contentWrap.className = 'msg-content-wrap';

      const headerDiv = document.createElement('div');
      headerDiv.className = 'msg-header';
      
      const timeStr = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      headerDiv.innerHTML = `<span>${escapeHTML(msg.senderName)}</span> <span class="msg-time">${timeStr}</span>`;

      const textDiv = document.createElement('div');
      textDiv.className = 'msg-text';
      textDiv.textContent = msg.text;

      contentWrap.appendChild(headerDiv);
      contentWrap.appendChild(textDiv);

      if (isOwn) {
        msgDiv.appendChild(contentWrap);
        msgDiv.appendChild(avatarDiv);
      } else {
        msgDiv.appendChild(avatarDiv);
        msgDiv.appendChild(contentWrap);
      }

      messagesBox.appendChild(msgDiv);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    // Send Message
    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();

      if (!text || !currentUser) return;

      const newMsgRef = db.ref('messages').push();
      newMsgRef.set({
        uid: currentUser.uid,
        senderName: userProfile.displayName || 'Anonymous',
        avatar: userProfile.avatar || '?',
        avatarBg: userProfile.avatarBg || '#fca311',
        avatarColor: userProfile.avatarColor || '#000000',
        bubbleBg: userProfile.bubbleBg || '#1b263b',
        textColor: userProfile.textColor || '#ffffff',
        text: text,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });

      input.value = '';
    }

    // Toggle Profile Customizer View
    function showProfileView(show) {
      if (show) {
        document.getElementById('editDisplayName').value = userProfile.displayName || '';
        document.getElementById('editAvatar').value = userProfile.avatar || '';
        document.getElementById('editBio').value = userProfile.bio || '';
        document.getElementById('editAvatarBg').value = userProfile.avatarBg || '#fca311';
        document.getElementById('editAvatarColor').value = userProfile.avatarColor || '#000000';
        document.getElementById('editBubbleBg').value = userProfile.bubbleBg || '#1b263b';
        document.getElementById('editTextColor').value = userProfile.textColor || '#ffffff';
        
        chatScreen.classList.add('hidden');
        profileScreen.classList.remove('hidden');
      } else {
        profileScreen.classList.add('hidden');
        chatScreen.classList.remove('hidden');
      }
    }

    // Save Profile Settings to Firebase
    function saveProfile() {
      const newName = document.getElementById('editDisplayName').value.trim();
      const newAvatar = document.getElementById('editAvatar').value.trim().toUpperCase();
      const newBio = document.getElementById('editBio').value.trim();
      const newAvatarBg = document.getElementById('editAvatarBg').value;
      const newAvatarColor = document.getElementById('editAvatarColor').value;
      const newBubbleBg = document.getElementById('editBubbleBg').value;
      const newTextColor = document.getElementById('editTextColor').value;

      if (!newName) {
        document.getElementById('profileError').textContent = "Name cannot be empty.";
        return;
      }

      db.ref('users/' + currentUser.uid).update({
        displayName: newName,
        avatar: newAvatar || newName.charAt(0).toUpperCase(),
        bio: newBio,
        avatarBg: newAvatarBg,
        avatarColor: newAvatarColor,
        bubbleBg: newBubbleBg,
        textColor: newTextColor
      }).then(() => {
        document.getElementById('profileError').textContent = '';
        showProfileView(false);
      });
    }

    // Prevent HTML Injection
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
