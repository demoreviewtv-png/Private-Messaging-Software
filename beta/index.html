<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Chat Requiem</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom scrollbar for chat container */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #030712;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f2937;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151;
        }
    </style>
</head>
<body class="bg-black text-gray-100 min-h-screen flex flex-col justify-center items-center p-2 sm:p-4 selection:bg-red-500/30 selection:text-red-200">

    <div id="app" class="w-full max-w-4xl h-[94vh] bg-gray-950 border border-red-950/60 rounded-2xl shadow-[0_0_50px_rgba(153,27,27,0.15)] flex flex-col overflow-hidden relative">
        
        <!-- ================= AUTH VIEW ================= -->
        <div id="auth-screen" class="flex-1 flex flex-col justify-center items-center p-6 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-red-950/30 via-gray-950 to-black">
            <div class="w-full max-w-md bg-gray-900/80 border border-red-900/40 p-8 rounded-2xl shadow-2xl backdrop-blur-xl">
                <div class="text-center mb-8">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-red-950/50 border border-red-600/40 rounded-2xl text-red-500 mb-3 shadow-lg shadow-red-950/80 group transition">
                        <i class="fa-solid fa-shield-halved text-3xl group-hover:scale-110 transition-transform"></i>
                    </div>
                    <h1 class="text-2xl font-black tracking-widest uppercase text-white">Privacy Chat <span class="text-red-600">Requiem</span></h1>
                    <p class="text-[11px] text-gray-400 tracking-wider uppercase mt-1">Encrypted • Realtime • Anonymous</p>
                </div>

                <!-- Auth Toggle Tabs -->
                <div class="flex bg-gray-950 p-1 rounded-xl mb-6 border border-gray-800">
                    <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-semibold tracking-wider uppercase rounded-lg transition-all bg-red-700 text-white shadow-md">Log In</button>
                    <button id="tab-signup" onclick="switchAuthTab('signup')" class="flex-1 py-2 text-xs font-semibold tracking-wider uppercase rounded-lg transition-all text-gray-400 hover:text-white">Sign Up</button>
                </div>

                <!-- Error Alert Box -->
                <div id="auth-error" class="hidden mb-4 p-3 bg-red-950/50 border border-red-600/50 rounded-xl text-red-300 text-xs flex items-center gap-2">
                    <i class="fa-solid fa-circle-exclamation text-red-400"></i>
                    <span id="auth-error-msg">Error details here</span>
                </div>

                <!-- Auth Form -->
                <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                    <div id="display-name-group" class="hidden">
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Codename / Alias</label>
                        <div class="relative">
                            <i class="fa-solid fa-user-secret absolute left-3.5 top-3 text-gray-500 text-sm"></i>
                            <input type="text" id="auth-display-name" placeholder="Agent_00" class="w-full pl-10 pr-4 py-2.5 bg-gray-950/90 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-red-600 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Email Credentials</label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-3.5 top-3 text-gray-500 text-sm"></i>
                            <input type="email" id="auth-email" required placeholder="operative@requiem.sec" class="w-full pl-10 pr-4 py-2.5 bg-gray-950/90 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-red-600 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Access Key (Password)</label>
                        <div class="relative">
                            <i class="fa-solid fa-key absolute left-3.5 top-3 text-gray-500 text-sm"></i>
                            <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-gray-950/90 border border-gray-800 rounded-xl text-sm text-white focus:outline-none focus:border-red-600 transition">
                        </div>
                    </div>

                    <button type="submit" id="auth-submit-btn" class="w-full py-3 bg-red-700 hover:bg-red-600 text-white text-xs font-bold uppercase tracking-widest rounded-xl shadow-lg shadow-red-950/60 transition-all flex justify-center items-center gap-2 mt-6">
                        <span>Enter Terminal</span>
                        <i class="fa-solid fa-right-to-bracket text-xs"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- ================= MAIN CHAT VIEW ================= -->
        <div id="chat-screen" class="hidden flex-1 flex flex-col h-full bg-gray-950">
            <!-- Header -->
            <header class="p-4 bg-gray-950 border-b border-gray-800/80 flex items-center justify-between backdrop-blur">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-red-950/60 border border-red-600/40 rounded-xl flex items-center justify-center text-red-500 shadow-md">
                        <i class="fa-solid fa-shield-halved text-xl"></i>
                    </div>
                    <div>
                        <h2 class="font-bold text-white text-sm tracking-wide flex items-center gap-2">
                            PRIVACY CHAT <span class="text-red-500 font-extrabold">REQUIEM</span>
                        </h2>
                        <span class="inline-flex items-center text-[10px] text-emerald-400 uppercase tracking-widest">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-ping"></span> Secure Feed Online
                        </span>
                    </div>
                </div>

                <!-- User Profile Quick Bar -->
                <div class="flex items-center space-x-3">
                    <button onclick="openProfileModal()" class="flex items-center space-x-2.5 bg-gray-900 hover:bg-gray-800 border border-gray-800 p-1.5 pr-3 rounded-xl transition text-left group">
                        <div id="header-avatar" class="w-8 h-8 rounded-lg bg-red-700 flex items-center justify-center font-bold text-white text-xs shadow">
                            ?
                        </div>
                        <div class="hidden sm:block">
                            <div id="header-name" class="text-xs font-bold text-gray-200 group-hover:text-red-400 transition">Agent</div>
                            <div id="header-status" class="text-[10px] text-gray-400 truncate max-w-[110px]">Active</div>
                        </div>
                        <i class="fa-solid fa-sliders text-gray-500 group-hover:text-white text-xs ml-1"></i>
                    </button>

                    <button onclick="handleLogout()" title="Disconnect Terminal" class="w-9 h-9 rounded-xl bg-gray-900 hover:bg-red-950/80 border border-gray-800 text-gray-400 hover:text-red-400 flex items-center justify-center transition">
                        <i class="fa-solid fa-power-off text-sm"></i>
                    </button>
                </div>
            </header>

            <!-- Message Feed -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 bg-gradient-to-b from-gray-950 via-gray-900/50 to-gray-950">
                <div id="loading-messages" class="text-center py-12 text-gray-500 text-xs tracking-wider uppercase">
                    <i class="fa-solid fa-spinner fa-spin text-red-600 text-2xl mb-2 block"></i>
                    Establishing Encrypted Stream...
                </div>
            </div>

            <!-- Message Input Area -->
            <div class="p-3 sm:p-4 bg-gray-950 border-t border-gray-800/80">
                <form id="chat-form" onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                    <input type="text" id="message-input" autocomplete="off" placeholder="Transmit secure message..." class="flex-1 bg-gray-900 border border-gray-800 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-red-600/80 transition">
                    <button type="submit" class="bg-red-700 hover:bg-red-600 text-white font-bold px-5 py-3 rounded-xl shadow-lg shadow-red-950/60 transition flex items-center justify-center">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- ================= PROFILE MODAL ================= -->
        <div id="profile-modal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex justify-center items-center p-4">
            <div class="bg-gray-950 border border-red-900/40 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5 relative">
                <button onclick="closeProfileModal()" class="absolute right-4 top-4 text-gray-500 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>

                <h3 class="text-lg font-bold text-white uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-user-gear text-red-500"></i> Identity Matrix
                </h3>

                <!-- Live Preview -->
                <div class="flex items-center gap-4 p-3.5 bg-gray-900/90 rounded-xl border border-gray-800">
                    <div id="modal-preview-avatar" class="w-12 h-12 rounded-xl bg-red-700 flex items-center justify-center font-bold text-white text-base shadow">
                        ?
                    </div>
                    <div>
                        <p id="modal-preview-name" class="font-bold text-white text-sm">Agent Alias</p>
                        <p id="modal-preview-status" class="text-xs text-gray-400">Status details...</p>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Codename / Display Name</label>
                        <input type="text" id="profile-name-input" class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-600">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Status / Directive</label>
                        <input type="text" id="profile-status-input" placeholder="e.g. Operating in dark mode..." class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-600">
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-2">Signature Color</label>
                        <div class="flex items-center gap-2" id="color-picker-container">
                            <!-- JS injections -->
                        </div>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1">Avatar Image URL (Optional)</label>
                        <input type="url" id="profile-avatar-url-input" placeholder="https://..." class="w-full bg-gray-900 border border-gray-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-600">
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button onclick="closeProfileModal()" class="px-4 py-2 bg-gray-900 hover:bg-gray-800 text-gray-400 text-xs font-semibold uppercase tracking-wider rounded-xl transition">Abort</button>
                    <button onclick="saveProfile()" class="px-5 py-2 bg-red-700 hover:bg-red-600 text-white text-xs font-semibold uppercase tracking-wider rounded-xl shadow-lg shadow-red-950/60 transition">Update Identity</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getDatabase, 
            ref, 
            push, 
            set, 
            onValue, 
            get,
            child,
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Provided Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyClRzYRn4d4iXLLKQGRVntev3LQwTfuDLQ",
            authDomain: "redroom-9f4a0.firebaseapp.com",
            databaseURL: "https://redroom-9f4a0-default-rtdb.firebaseio.com",
            projectId: "redroom-9f4a0",
            storageBucket: "redroom-9f4a0.firebasestorage.app",
            messagingSenderId: "646291907356",
            appId: "1:646291907356:web:29f88d37dbed10775790d9",
            measurementId: "G-5QF7S4HR60"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // State Variables
        let currentUser = null;
        let currentUserProfile = {
            displayName: '',
            color: '#dc2626',
            avatarUrl: '',
            status: 'Hey there!'
        };
        let authMode = 'login'; // 'login' or 'signup'
        let selectedColor = '#dc2626';

        const PRESET_COLORS = ['#dc2626', '#ea580c', '#d97706', '#16a34a', '#2563eb', '#9333ea', '#db2777'];

        window.switchAuthTab = function(mode) {
            authMode = mode;
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');
            const displayNameGroup = document.getElementById('display-name-group');
            const submitBtn = document.getElementById('auth-submit-btn');

            document.getElementById('auth-error').classList.add('hidden');

            if (mode === 'login') {
                tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-red-600 text-white shadow";
                tabSignup.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white";
                displayNameGroup.classList.add('hidden');
                submitBtn.querySelector('span').innerText = "Log In";
            } else {
                tabSignup.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all bg-red-600 text-white shadow";
                tabLogin.className = "flex-1 py-2 text-sm font-medium rounded-lg transition-all text-gray-400 hover:text-white";
                displayNameGroup.classList.remove('hidden');
                submitBtn.querySelector('span').innerText = "Create Account";
            }
        };

        window.handleAuthSubmit = async function(e) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const displayName = document.getElementById('auth-display-name').value;

            const errorBox = document.getElementById('auth-error');
            const errorMsg = document.getElementById('auth-error-msg');
            errorBox.classList.add('hidden');

            try {
                if (authMode === 'signup') {
                    if (!displayName.trim()) {
                        throw new Error("Please enter a display name.");
                    }
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const uid = userCredential.user.uid;
                    
                    // Create default profile in Realtime DB
                    const initialProfile = {
                        displayName: displayName.trim(),
                        color: PRESET_COLORS[Math.floor(Math.random() * PRESET_COLORS.length)],
                        status: "Identity initialized.",
                        avatarUrl: ""
                    };
                    await set(ref(db, 'users/' + uid), initialProfile);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                errorMsg.innerText = error.message.replace("Firebase: ", "");
                errorBox.classList.remove('hidden');
            }
        };

        window.handleLogout = function() {
            signOut(auth);
        };

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const authScreen = document.getElementById('auth-screen');
            const chatScreen = document.getElementById('chat-screen');

            if (user) {
                authScreen.classList.add('hidden');
                chatScreen.classList.remove('hidden');

                // Load User Profile Data
                const userRef = ref(db, 'users/' + user.uid);
                onValue(userRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        currentUserProfile = data;
                        updateProfileUI();
                    }
                });

                // Start Listening to Messages Realtime
                listenToMessages();
            } else {
                chatScreen.classList.add('hidden');
                authScreen.classList.remove('hidden');
            }
        });

        function listenToMessages() {
            const messagesRef = ref(db, 'messages');
            const container = document.getElementById('messages-container');

            onValue(messagesRef, (snapshot) => {
                container.innerHTML = '';
                const data = snapshot.val();

                if (!data) {
                    container.innerHTML = `
                        <div class="text-center py-12 text-gray-500 text-sm">
                            <i class="fa-regular fa-comments text-3xl mb-2 text-gray-600 block"></i>
                            No messages yet. Start the conversation!
                        </div>`;
                    return;
                }

                // Render Messages
                const messageList = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                }));

                messageList.forEach(msg => {
                    const isSelf = msg.uid === currentUser.uid;
                    const msgEl = document.createElement('div');
                    msgEl.className = `flex items-start gap-3 ${isSelf ? 'flex-row-reverse' : ''}`;

                    const formattedTime = msg.timestamp 
                        ? new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) 
                        : '';

                    // Avatar HTML
                    let avatarHtml = '';
                    if (msg.avatarUrl) {
                        avatarHtml = `<img src="${escapeHtml(msg.avatarUrl)}" class="w-8 h-8 rounded-full object-cover border border-gray-700 shadow">`;
                    } else {
                        const bgCol = msg.color || '#dc2626';
                        const firstInitial = (msg.sender || '?').charAt(0).toUpperCase();
                        avatarHtml = `<div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white text-xs shadow" style="background-color: ${bgCol}">${firstInitial}</div>`;
                    }

                    msgEl.innerHTML = `
                        ${avatarHtml}
                        <div class="max-w-[75%] sm:max-w-[65%]">
                            <div class="flex items-center gap-2 mb-1 ${isSelf ? 'justify-end' : ''}">
                                <span class="text-xs font-bold text-gray-300">${escapeHtml(msg.sender || 'Anonymous')}</span>
                                <span class="text-[10px] text-gray-500">${formattedTime}</span>
                            </div>
                            <div class="p-3 rounded-2xl text-sm leading-relaxed shadow-sm ${
                                isSelf 
                                    ? 'bg-red-700 text-white rounded-tr-none' 
                                    : 'bg-gray-900 border border-gray-800 text-gray-100 rounded-tl-none'
                            }">
                                ${escapeHtml(msg.text)}
                            </div>
                        </div>
                    `;

                    container.appendChild(msgEl);
                });

                // Auto Scroll to Bottom
                container.scrollTop = container.scrollHeight;
            });
        }

        window.handleSendMessage = async function(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (!text || !currentUser) return;

            input.value = '';

            const messagesRef = ref(db, 'messages');
            const newMessageRef = push(messagesRef);

            await set(newMessageRef, {
                uid: currentUser.uid,
                sender: currentUserProfile.displayName || currentUser.email.split('@')[0],
                color: currentUserProfile.color || '#dc2626',
                avatarUrl: currentUserProfile.avatarUrl || '',
                text: text,
                timestamp: serverTimestamp()
            });
        };

        function updateProfileUI() {
            const headerName = document.getElementById('header-name');
            const headerStatus = document.getElementById('header-status');
            const headerAvatar = document.getElementById('header-avatar');

            const name = currentUserProfile.displayName || currentUser?.email?.split('@')[0] || 'User';
            headerName.innerText = name;
            headerStatus.innerText = currentUserProfile.status || 'Online';

            if (currentUserProfile.avatarUrl) {
                headerAvatar.outerHTML = `<img id="header-avatar" src="${escapeHtml(currentUserProfile.avatarUrl)}" class="w-8 h-8 rounded-full object-cover border border-gray-700 shadow">`;
            } else {
                const currentAvatar = document.getElementById('header-avatar');
                const newAvatar = document.createElement('div');
                newAvatar.id = 'header-avatar';
                newAvatar.className = 'w-8 h-8 rounded-full flex items-center justify-center font-bold text-white text-sm shadow';
                newAvatar.style.backgroundColor = currentUserProfile.color || '#dc2626';
                newAvatar.innerText = name.charAt(0).toUpperCase();
                
                if (currentAvatar) {
                    currentAvatar.replaceWith(newAvatar);
                }
            }
        }

        window.openProfileModal = function() {
            document.getElementById('profile-name-input').value = currentUserProfile.displayName || '';
            document.getElementById('profile-status-input').value = currentUserProfile.status || '';
            document.getElementById('profile-avatar-url-input').value = currentUserProfile.avatarUrl || '';
            selectedColor = currentUserProfile.color || '#dc2626';

            renderColorPicker();
            updateModalPreview();
            document.getElementById('profile-modal').classList.remove('hidden');
        };

        window.closeProfileModal = function() {
            document.getElementById('profile-modal').classList.add('hidden');
        };

        function renderColorPicker() {
            const container = document.getElementById('color-picker-container');
            container.innerHTML = '';
            PRESET_COLORS.forEach(color => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `w-7 h-7 rounded-full border-2 transition ${selectedColor === color ? 'border-white scale-110' : 'border-transparent opacity-80'}`;
                btn.style.backgroundColor = color;
                btn.onclick = () => {
                    selectedColor = color;
                    renderColorPicker();
                    updateModalPreview();
                };
                container.appendChild(btn);
            });
        }

        function updateModalPreview() {
            const nameInput = document.getElementById('profile-name-input').value.trim() || 'Name';
            const statusInput = document.getElementById('profile-status-input').value.trim() || 'Status message';
            const avatarUrlInput = document.getElementById('profile-avatar-url-input').value.trim();

            document.getElementById('modal-preview-name').innerText = nameInput;
            document.getElementById('modal-preview-status').innerText = statusInput;

            const previewAvatar = document.getElementById('modal-preview-avatar');

            if (avatarUrlInput) {
                previewAvatar.outerHTML = `<img id="modal-preview-avatar" src="${escapeHtml(avatarUrlInput)}" class="w-12 h-12 rounded-full object-cover border border-gray-700 shadow">`;
            } else {
                const currentAvatar = document.getElementById('modal-preview-avatar');
                const newAvatar = document.createElement('div');
                newAvatar.id = 'modal-preview-avatar';
                newAvatar.className = 'w-12 h-12 rounded-full flex items-center justify-center font-bold text-white text-lg shadow-md';
                newAvatar.style.backgroundColor = selectedColor;
                newAvatar.innerText = nameInput.charAt(0).toUpperCase();

                if (currentAvatar) {
                    currentAvatar.replaceWith(newAvatar);
                }
            }
        }

        document.getElementById('profile-name-input').addEventListener('input', updateModalPreview);
        document.getElementById('profile-status-input').addEventListener('input', updateModalPreview);
        document.getElementById('profile-avatar-url-input').addEventListener('input', updateModalPreview);

        window.saveProfile = async function() {
            if (!currentUser) return;

            const updatedProfile = {
                displayName: document.getElementById('profile-name-input').value.trim(),
                status: document.getElementById('profile-status-input').value.trim(),
                avatarUrl: document.getElementById('profile-avatar-url-input').value.trim(),
                color: selectedColor
            };

            await set(ref(db, 'users/' + currentUser.uid), updatedProfile);
            closeProfileModal();
        };

        // Helper Utility
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }
    </script>
</body>
</html>
